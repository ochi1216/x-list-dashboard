function updateBands(T, sess, rs) {
  // 取得遅れ
  let last = 0;
  for (const p of allPosts) { const t = Date.parse(p.fetched_at); if (t > last) last = t; }
  try { const fr = digestData && digestData.lastRun && Date.parse(digestData.lastRun.finished_at); if (fr > last) last = fr; } catch (e) { /* ignore */ }
  const lateH = last ? (Date.now() - last) / 3600e3 : 0;
  TopBand.set("late", allPosts.length && lateH >= FETCH_LATE_HOURS ? { text: `⚠️ 取得が遅れています(最終取得 ${Math.floor(lateH)}時間前)`, onClick: () => load() } : null);
  // 聴き残し
  const leftover = rs.n > 0 ? `⏸ 中断した続きがあります(残り${rs.cards.length || rs.n}件)` : T.carry > 0 ? `🎧 昨日からの聴き残しが${T.carry}件あります(聴くに含まれます)` : null;
  TopBand.set("leftover", leftover ? { text: leftover, onClick: () => Tabs.show("today") } : null);
  // 暫定
  const prov = T.listen.concat(T.skim, T.hold).some(isProvisional);
  TopBand.set("provisional", prov ? { text: "🧪 点数は暫定です(採点モデル切替前)。目安として見てください。" } : null);
  // 未送信は AdminQueue.onChange が設定
}

window.onPostsLoaded = function () { refreshToday(); loadDigestDaily(); };
window.onDigestRendered = function () { if (todayCache) refreshToday(); };

// ================================================================ 昇格/降格(端末キュー経由)
function localPromote(p) {
  p.listen_tier = "listen"; p.manual_action = "promote"; p.manual_at = new Date().toISOString(); p.tier_assigned_at = p.manual_at; p.tier_reason = "manual_promote";
  listDirty = true;
}
function promoteCard(p) {
  const wasRead = !!p.is_read;
  localPromote(p);
  AdminQueue.add("tier_set", { post_url: p.post_url, how: "promote" });
  if (wasRead) { // 既読化済み(流すで2秒超など)は未読へ戻す(anonでis_readは書き込める)
    p.is_read = false;
    sbFetch(`x_posts?post_url=eq.${encodeURIComponent(p.post_url)}`, { method: "PATCH", headers: { Prefer: "return=minimal" }, body: JSON.stringify({ is_read: false }) }).catch((e) => console.error("unread failed", e));
  }
}

// ================================================================ 聴くモード
const LP = {
  active: false, state: "idle", // idle|playing|paused|interrupted|finished
  items: [], segs: [], cum: [], player: null,
  curSeg: -1, curItem: null, extra: false, undo: null, voices: [],
};

function ttsAvailable() { return !!(window.TTS && typeof TTS.createPlayer === "function" && window.speechSynthesis); }

function getVoice() {
  try {
    const vs = (window.speechSynthesis && speechSynthesis.getVoices && speechSynthesis.getVoices()) || [];
    return window.TTS && TTS.pickVoice ? TTS.pickVoice(vs, voiceQuality()) : null;
  } catch (e) { return null; }
}

function cleanText(t) { return window.TTS && TTS.clean ? TTS.clean(String(t || "")) : String(t || ""); }
function splitText(t) { return window.TTS && TTS.split ? TTS.split(t) : [t]; }

function buildSequence(opts) {
  // opts: {topics:[], cards:[posts], hold:[posts]}
  const segs = [], items = [];
  const push = (seg, its) => {
    seg.start = items.length;
    for (const it of its) items.push({ kind: it.kind, text: it.text, seg: segs.length });
    seg.end = items.length - 1;
    if (seg.end >= seg.start) segs.push(seg);
  };
  if (opts.topics && opts.topics.length) {
    const its = [{ kind: "title", text: "今日の要点です。" }];
    for (const t of opts.topics) {
      const h = cleanText(t.headline); if (h) its.push({ kind: "title", text: h });
      for (const s of splitText(cleanText(t.summary))) if (s) its.push({ kind: "body", text: s });
    }
    push({ type: "digest", topics: opts.topics }, its);
  }
  for (const p of opts.cards || []) push({ type: "card", url: p.post_url }, cardItems(p));
  if (opts.hold && opts.hold.length) {
    const its = [{ kind: "title", text: "保留の上位の見出しです。" }];
    for (const p of opts.hold) { const h = cleanText(titleOf(p)); if (h) its.push({ kind: "title", text: h }); }
    push({ type: "hold", urls: opts.hold.map((p) => p.post_url) }, its);
  }
  // 累計文字数(残り時間の計算用)
  const cum = []; let n = 0;
  for (const it of items) { n += String(it.text).length; cum.push(n); }
  return { segs, items, cum };
}

// ▶押下時に当日の聴く全件を端末に確保する(読み上げに必要な項目だけ)。再読込後に通信できなくても続きから再生できる。
const SNAP_FIELDS = ["post_url", "author_handle", "author_name", "gist", "summary", "content", "speech_title", "speech_body", "score", "score_kind", "score_reason", "score_state", "scored_model", "manual_action", "manual_at", "listen_tier", "tier_assigned_at", "is_read", "posted_at", "fetched_at", "image_urls"];
let snapMap = null;
function snapLoad() {
  if (snapMap) return snapMap;
  snapMap = new Map();
  try {
    const c = JSON.parse(lsGet(K.cache, "null"));
    if (c && c.day === dayKey(Date.now()) && Array.isArray(c.posts)) for (const p of c.posts) snapMap.set(p.post_url, p);
  } catch (e) { /* ignore */ }
  return snapMap;
}
function snapSave(posts) {
  snapMap = new Map();
  const arr = posts.map((p) => { const o = {}; for (const f of SNAP_FIELDS) o[f] = p[f] === undefined ? null : p[f]; return o; });
  for (const o of arr) snapMap.set(o.post_url, o);
  lsSet(K.cache, JSON.stringify({ day: dayKey(Date.now()), savedAt: Date.now(), posts: arr }));
}
function snapMarkRead(url) {
  const o = snapLoad().get(url);
  if (!o || o.is_read) return;
  o.is_read = true;
  lsSet(K.cache, JSON.stringify({ day: dayKey(Date.now()), savedAt: Date.now(), posts: [...snapMap.values()] }));
}
const postByUrl = (u) => allPosts.find((p) => p.post_url === u) || snapLoad().get(u) || null;

function remainingSec(i) {
  if (!LP.cum.length) return 0;
  const total = LP.cum[LP.cum.length - 1];
  const done = i > 0 ? LP.cum[i - 1] : 0;
  return (total - done) / (CPS * listenSpeed());
}

function showFinishPanel(show) { $("plFinish").hidden = !show; }
function showInterruptPanel(show) { $("plInterrupted").hidden = !show; }

function updateToggle() {
  const t = $("plToggle");
  t.innerHTML = LP.state === "paused" ? "▶ 再開" : "⏸ 止める";
}
function updateSpeedBtn() { $("plSpeed").textContent = `${listenSpeed()}x`; }

function renderPlayerSeg() {
  const seg = LP.segs[LP.curSeg];
  const el = $("plCard");
  if (!seg) { el.innerHTML = ""; return; }
  const cards = LP.segs.filter((s) => s.type === "card");
  let pos = "";
  if (seg.type === "card") {
    const no = cards.indexOf(seg) + 1;
    pos = `${no} / ${cards.length}`;
    const p = postByUrl(seg.url) || {};
    const meta = `${esc(p.author_name || p.author_handle || "")} ${esc(p.author_handle && p.author_name ? p.author_handle : "")}`;
    el.innerHTML = `<div class="pl-title">${scoreBadgeHtml(p)}${esc(titleOf(p))}</div>${kindLineHtml(p)}
      <div class="pl-body">${esc(bodyOf(p))}</div><div class="pl-meta">${meta}</div>`;
    $("plReject").disabled = false;
  } else if (seg.type === "digest") {
    pos = "今日の要点";
    el.innerHTML = `<div class="pl-title">📌 今日の要点</div>` + seg.topics.map((t) => `<div class="topic"><b>${esc(t.headline)}</b><p>${esc(t.summary)}</p></div>`).join("");
    $("plReject").disabled = true;
  } else {
    pos = "保留の見出し";
    el.innerHTML = `<div class="pl-title">🗂 保留の上位</div><div class="pl-list">${seg.urls.map((u) => { const p = postByUrl(u) || {}; return `<div>${scoreBadgeHtml(p)}${esc(titleOf(p))}</div>`; }).join("")}</div>`;
    $("plReject").disabled = true;
  }
  const rem = remainingSec(LP.items.findIndex((it) => it.seg === LP.curSeg));
  $("plPos").textContent = `${pos} ・ 残り約${minutesLabel(rem)}分`;
  el.scrollTop = 0;
}

function saveSession() {
  if (!LP.active || LP.curSeg < 0) return;
  const cur = LP.segs[LP.curSeg];
  const cardUrls = [], holdUrls = [];
  for (let i = Math.max(0, LP.curSeg); i < LP.segs.length; i++) {
    const s = LP.segs[i];
    if (s.type === "card") { const p = postByUrl(s.url); if (p && !p.is_read) cardUrls.push(s.url); }
    else if (s.type === "hold") holdUrls.push(...s.urls);
  }
  const withDigest = !!cur && cur.type === "digest";
  if (!cardUrls.length && !holdUrls.length && !withDigest) { lsDel(K.session); return; }
  lsSet(K.session, JSON.stringify({ day: dayKey(Date.now()), cardUrls, holdUrls, withDigest, savedAt: Date.now() }));
}

function makePlayer() {
  return TTS.createPlayer({
    synth: window.speechSynthesis,
    Utterance: window.SpeechSynthesisUtterance,
    getVoice,
    getRate: listenSpeed,
    pauseMs: PAUSE_MS(),
    onItemStart(i) {
      if (!LP.active || LP.state === "interrupted" || LP.state === "finished") return;
      const it = LP.items[i];
      if (!it) return;
      LP.curItem = i;
      if (it.seg !== LP.curSeg) {
        LP.curSeg = it.seg;
        renderPlayerSeg();
        saveSession();
      } else {
        const rem = remainingSec(i);
        const base = $("plPos").textContent.split(" ・ ")[0];
        $("plPos").textContent = `${base} ・ 残り約${minutesLabel(rem)}分`;
      }
    },
    onItemEnd(i, why) {
      if (!LP.active || LP.state !== "playing" || LP.curItem !== i) return;
      if (why === "forced") return; // 読み上げが詰まって強制送りになった場合は既読にしない
      const it = LP.items[i];
      const seg = it && LP.segs[it.seg];
      if (seg && seg.type === "card" && i === seg.end) {
        // 最後まで再生した → 既読(聴く)。途中停止は既読にしない。
        const p = postByUrl(seg.url);
        if (p && !p.is_read) markReadQuiet(seg.url, "listen");
      }
    },
    onDone() { if (LP.active && LP.state === "playing") finishSequence(); },
    onStall() { if (LP.active && LP.state === "playing") interrupt("stall"); },
  });
}

function startSequence(seq, opts) {
  opts = opts || {};
  if (!ttsAvailable()) { alert("音声モジュール(TTS)を読み込めませんでした。一覧モードをご利用ください。"); return false; }
  // 他の再生を止める
  try { if (typeof isPlaying !== "undefined" && isPlaying) { isPlaying = false; window.speechSynthesis.cancel(); updatePlayButton(); } if (autoMoveDirection !== 0) stopAutoMove(); } catch (e) { /* ignore */ }
  killPlayer();
  if (!seq.items.length) return false;
  LP.active = true; LP.state = "playing"; LP.items = seq.items; LP.segs = seq.segs; LP.cum = seq.cum;
  LP.curSeg = 0; LP.curItem = null; LP.extra = !!opts.extra;
  LP.player = makePlayer();
  setView("listen");
  showFinishPanel(false); showInterruptPanel(false);
  hideToast();
  updateToggle(); updateSpeedBtn();
  renderPlayerSeg();
  LP.player.play(LP.items, 0);
  return true;
}

function killPlayer() {
  const pl = LP.player;
  LP.player = null;
  const prev = LP.state;
  LP.state = "finished"; // 以降の onStall/onItemEnd を無視させる
  if (pl) { try { pl.stop(); } catch (e) { /* ignore */ } }
  LP.state = prev === "playing" || prev === "paused" ? "idle" : prev;
}

function startListenNormal() {
  const T = computeToday();
  if (!T.listen.length) return;
  const first = lsGet(K.introDay, "") !== T.dayKey;
  const topics = first ? digestTopics(T.dayKey) : [];
  const seq = buildSequence({ topics, cards: T.listen, hold: first ? T.holdTop : [] });
  snapSave(T.listen.concat(first ? T.holdTop : []));
  lsDel(K.session);
  if (startSequence(seq)) { if (first) lsSet(K.introDay, T.dayKey); }
}

function startResume() {
  const s = loadSession();
  const rs = resumable(s);
  if (!rs.n) { refreshToday(); return; }
  const topics = rs.digest ? digestTopics(s.day) : [];
  const seq = buildSequence({ topics, cards: rs.cards, hold: rs.hold });
  startSequence(seq);
}

function startExtraTen() {
  const T = computeToday();
  const speed = listenSpeed();
  const pick = []; let sec = 0;
  for (const p of T.skimHigh) { if (sec >= EXTRA_SEC) break; pick.push(p); sec += cardSec(p, speed); }
  if (!pick.length) { refreshToday(); return; }
  snapSave(pick);
  startSequence(buildSequence({ cards: pick }), { extra: true });
}

function finishSequence() {
  if (!LP.active) return;
  const pl = LP.player; LP.player = null;
  LP.state = "finished";
  if (pl) { try { pl.stop(); } catch (e) { /* ignore */ } }
  lsDel(K.session);
  const T = computeToday();
  const n = T.skimHigh.length;
  $("plFinishMsg").textContent = LP.extra ? "✅ 追加分を聴き終わりました。" : "✅ 聴き終わりました。";
  $("plOverflow").hidden = n === 0;
  $("plMoreTen").hidden = n === 0;
  $("plOverflow").textContent = n > 0 ? `上限で流すに回った${LISTEN_THRESHOLD}点以上が${n}件あります。続けますか` : "";
  showFinishPanel(true);
}

function interrupt(reason) {
  if (!LP.active || LP.state === "interrupted" || LP.state === "finished" || LP.state === "idle") return;
  saveSession();
  LP.state = "interrupted";
  const pl = LP.player; LP.player = null;
  if (pl) { try { pl.stop(); } catch (e) { /* ignore */ } }
  commitPendingDemote();
  showInterruptPanel(true);
}

function leaveListen() {
  const pl = LP.player; LP.player = null;
  if (pl) { try { pl.stop(); } catch (e) { /* ignore */ } }
  LP.active = false; LP.state = "idle";
  commitPendingDemote();
  setView("tabs");
}

function jumpToSeg(n) {
  LP.curItem = null;
  if (n >= LP.segs.length) { finishSequence(); return; }
  if (LP.state === "paused") { try { window.speechSynthesis.resume(); } catch (e) { /* ignore */ } }
  LP.state = "playing";
  updateToggle();
  LP.player.play(LP.items, LP.segs[n].start);
}

function curCardPost() {
  const seg = LP.segs[LP.curSeg];
  return seg && seg.type === "card" ? postByUrl(seg.url) : null;
}

// 次へ = 既読にして対象外
function skipCurrent() {
  if (!LP.active || LP.state === "interrupted" || LP.state === "finished") return;
  const seg = LP.segs[LP.curSeg];
  if (seg && seg.type === "card") { const p = postByUrl(seg.url); if (p && !p.is_read) markReadQuiet(seg.url, "user"); }
  jumpToSeg(LP.curSeg + 1);
}

// 止める・再開
function toggleCurrent() {
  if (!LP.active || !LP.player) return;
  if (LP.state === "playing") { LP.state = "paused"; LP.player.pause(); }
  else if (LP.state === "paused") { LP.state = "playing"; LP.player.resume(); }
  updateToggle();
}

// これは不要 = 保留へ降格 + 既読(5秒の取り消し付き)
function rejectCurrent() {
  if (!LP.active || LP.state === "interrupted" || LP.state === "finished") return;
  const p = curCardPost();
  if (!p) return;
  commitPendingDemote(); // 直前の保留中の降格は確定
  const prev = { listen_tier: p.listen_tier, manual_action: p.manual_action, manual_at: p.manual_at, is_read: p.is_read, tier_reason: p.tier_reason };
  p.listen_tier = "hold"; p.manual_action = "demote"; p.manual_at = new Date().toISOString(); p.is_read = true;
  listDirty = true;
  const segIdx = LP.curSeg;
  const u = { url: p.post_url, prev, segIdx, timer: null, tick: null, until: Date.now() + UNDO_MS };
  u.timer = setTimeout(commitPendingDemote, UNDO_MS);
  LP.undo = u;
  showToast(p);
  jumpToSeg(LP.curSeg + 1);
}

function showToast(p) {
  $("plToastMsg").textContent = `「${titleOf(p).slice(0, 24)}」を保留へ降格しました`;
  $("plUndo").textContent = "取り消し(5秒)";
  $("plToast").hidden = false;
}
function hideToast() { $("plToast").hidden = true; }

function commitPendingDemote() {
  const u = LP.undo;
  if (!u) return;
  LP.undo = null;
  clearTimeout(u.timer);
  hideToast();
  AdminQueue.add("tier_set", { post_url: u.url, how: "demote" });
  rpcMarkRead(u.url, "user").then((ok) => { if (!ok) patchIsRead([u.url], true).catch(() => {}); });
}

function undoDemote() {
  const u = LP.undo;
  if (!u) return;
  LP.undo = null;
  clearTimeout(u.timer);
  hideToast();
  const p = postByUrl(u.url);
  if (p) Object.assign(p, u.prev);
  listDirty = true;
  // その場でそのカードへ戻って続きを聴く
  if (LP.active && LP.state !== "finished" && LP.state !== "interrupted" && LP.player && LP.segs[u.segIdx]) jumpToSeg(u.segIdx);
  else if (LP.active && LP.state === "finished") { /* 聴き終わり後は元の状態に戻すだけ(次回▶で聴ける) */ }
}

$("plNext").addEventListener("click", skipCurrent);
$("plToggle").addEventListener("click", toggleCurrent);
$("plReject").addEventListener("click", rejectCurrent);
$("plUndo").addEventListener("click", undoDemote);
$("plExit").addEventListener("click", () => { if (LP.active && (LP.state === "playing" || LP.state === "paused")) saveSession(); leaveListen(); });
$("plBackA").addEventListener("click", leaveListen);
$("plBackB").addEventListener("click", leaveListen);
$("plResume").addEventListener("click", () => { showInterruptPanel(false); startResume(); });
$("plMoreTen").addEventListener("click", () => { showFinishPanel(false); startExtraTen(); });
$("plSpeed").addEventListener("click", () => {
  let i = SPEEDS.findIndex((v) => Math.abs(v - listenSpeed()) < 0.01);
  i = (i + 1) % SPEEDS.length;
  lsSet(K.speed, String(SPEEDS[i]));
  updateSpeedBtn();
  if (LP.player && LP.state === "playing") LP.player.setRate(listenSpeed());
});

// 画面が裏に回ったら中断扱い(iPhoneは裏で読み上げが止まるため。途中停止は未読のまま)
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") {
    if (document.body.dataset.view === "listen") interrupt("hidden");
    commitPendingDemote();
  }
});
window.addEventListener("pagehide", () => { commitPendingDemote(); if (document.body.dataset.view === "listen") interrupt("pagehide"); });

// ================================================================ 流すモード
const FL = { queue: [], idx: -1, elapsed: 0, marked: false, paused: false, timer: null, last: 0 };

function startFlow() {
  const T = computeToday();
  if (!T.skim.length) return;
  try { if (typeof isPlaying !== "undefined" && isPlaying) { isPlaying = false; window.speechSynthesis.cancel(); updatePlayButton(); } if (autoMoveDirection !== 0) stopAutoMove(); } catch (e) { /* ignore */ }
  FL.queue = T.skim.slice();
  FL.idx = -1; FL.paused = false;
  setView("flow");
  $("flEnd").hidden = true;
  $("flSecLabel").textContent = `${flowSec()}秒`;
  flowNext();
  clearInterval(FL.timer);
  FL.last = Date.now();
  FL.timer = setInterval(flowTick, 100);
}
function flowCur() { return FL.queue[FL.idx] || null; }
function flowRender() {
  const p = flowCur();
  if (!p) return;
  const img = Array.isArray(p.image_urls) && p.image_urls[0] ? `<img alt="" src="${esc(xImageVariant(p.image_urls[0], "small"))}">` : "";
  $("flCard").innerHTML = `<div class="fl-title">${scoreBadgeHtml(p)}${esc(titleOf(p))}</div>${kindLineHtml(p)}<div class="fl-body">${esc(bodyOf(p).slice(0, 200))}</div>${img}
    <div class="pl-meta">${esc(p.author_name || p.author_handle || "")}</div>`;
  $("flPos").textContent = `${FL.idx + 1} / ${FL.queue.length}`;
  $("flProg").style.width = "0%";
  $("flPaused").hidden = !FL.paused;
}
function flowNext() {
  FL.idx++;
  FL.elapsed = 0; FL.marked = false;
  if (FL.idx >= FL.queue.length) { flowEnd(); return; }
  flowRender();
}
function flowEnd() {
  clearInterval(FL.timer); FL.timer = null;
  $("flEndMsg").textContent = `🌊 流し終わりました(${FL.queue.length}件)。`;
  $("flEnd").hidden = false;
}
function flowTick() {
  const now = Date.now();
  const dt = Math.min(500, now - FL.last);
  FL.last = now;
  const p = flowCur();
  if (!p || FL.paused || document.body.dataset.view !== "flow") return;
  FL.elapsed += dt;
  if (!FL.marked && FL.elapsed >= FLOW_MARK_MS) { FL.marked = true; if (!p.is_read) markReadQuiet(p.post_url, "flow"); }
  const sec = flowSec() * 1000;
  $("flProg").style.width = `${Math.min(100, (FL.elapsed / sec) * 100)}%`;
  if (FL.elapsed >= sec) flowNext();
}
function flowToggle() { if (!flowCur()) return; FL.paused = !FL.paused; $("flPaused").hidden = !FL.paused; }
function flowListenThis() {
  const p = flowCur();
  if (!p) return;
  promoteCard(p); // 聴く待ちの先頭へ(手動昇格)
  FL.queue.splice(FL.idx, 1);
  FL.idx--; // flowNext が同じ位置の次カードへ進む
  flowNext();
}
function flowExit() {
  clearInterval(FL.timer); FL.timer = null;
  setView("tabs");
}
$("flCard").addEventListener("click", flowToggle);
$("flListen").addEventListener("click", flowListenThis);
$("flExit").addEventListener("click", flowExit);
$("flBack").addEventListener("click", flowExit);
function setFlowSec(v) { lsSet(K.flowSec, String(v)); $("flSecLabel").textContent = `${flowSec()}秒`; renderSettings(); }
$("flSecDown").addEventListener("click", () => setFlowSec(Math.max(2, flowSec() - 1)));
$("flSecUp").addEventListener("click", () => setFlowSec(Math.min(20, flowSec() + 1)));

// ================================================================ 今日タブのボタン
$("btnListen").addEventListener("click", startListenNormal);
$("btnResume").addEventListener("click", startResume);
$("btnExtraToday").addEventListener("click", startExtraTen);
$("btnFlow").addEventListener("click", startFlow);
$("btnList").addEventListener("click", () => setView("list"));
$("btnTodayReload").addEventListener("click", () => { load(); });
$("btnBackToday").addEventListener("click", () => {
  try { if (isPlaying) { isPlaying = false; window.speechSynthesis.cancel(); updatePlayButton(); } if (autoMoveDirection !== 0) stopAutoMove(); releasePin(); } catch (e) { /* ignore */ }
  setView("tabs");
});

// ================================================================ 設定: 再生
function renderSettings() {
  const sp = listenSpeed();
  $("setSpeedBtns").innerHTML = SPEEDS.map((v) => `<button type="button" data-speed="${v}" class="${Math.abs(v - sp) < 0.01 ? "on" : ""}">${v}x</button>`).join("");
  const vq = voiceQuality();
  $("setVoiceBtns").innerHTML = `<button type="button" data-voice="high" class="${vq === "high" ? "on" : ""}">高音質</button><button type="button" data-voice="standard" class="${vq === "standard" ? "on" : ""}">標準</button>`;
  const fs = flowSec();
  $("setFlowBtns").innerHTML = FLOW_SECS.map((v) => `<button type="button" data-flow="${v}" class="${v === fs ? "on" : ""}">${v}秒</button>`).join("");
}
$("setSpeedBtns").addEventListener("click", (e) => { const b = e.target.closest("button[data-speed]"); if (!b) return; lsSet(K.speed, b.dataset.speed); renderSettings(); updateSpeedBtn(); refreshToday(); });
$("setVoiceBtns").addEventListener("click", (e) => { const b = e.target.closest("button[data-voice]"); if (!b) return; lsSet(K.voice, b.dataset.voice); renderSettings(); });
$("setFlowBtns").addEventListener("click", (e) => { const b = e.target.closest("button[data-flow]"); if (!b) return; setFlowSec(Number(b.dataset.flow)); });
$("btnVoiceTest").addEventListener("click", () => {
  try {
    const synth = window.speechSynthesis; synth.cancel();
    const u = new SpeechSynthesisUtterance("これは声のテストです。聴く速度はこのくらいです。");
    u.lang = "ja-JP"; u.rate = listenSpeed();
    const v = getVoice(); if (v) u.voice = v;
    synth.speak(u);
  } catch (e) { /* ignore */ }
});
renderSettings();

// ================================================================ 起動
(function init() {
  const start = lsGet(K.tab, "today");
  if (document.body.dataset.view === "list") { /* #list で直接一覧モード */ }
  else Tabs.show(start === "today" || document.querySelector(`[data-tab-body="${start}"]`) ? start : "today");
  const st = AdminQueue.stats();
  TopBand.set("unsent", st.pending > 0 ? { text: `📤 未送信の操作が${st.pending}件あります${st.needLogin ? "(ログインが必要です・設定タブ)" : ""}`, onClick: () => Tabs.show("settings") } : null);
  refreshToday(); // 投稿の読み込みが先に終わっていた場合・通信できない場合(確保済みの続きを出す)も含め、まず描画
  if (allPosts.length) loadDigestDaily();
  AdminQueue.flush().catch(() => {});
})();

// テスト・第2段向けの公開
window.Beta = { computeToday, rankCmp, dayKey, dayStartMs, cardItems, listenSpeed, setView, refreshToday, startListenNormal, startFlow, LP, FL, DG, K };
})();
</script>
