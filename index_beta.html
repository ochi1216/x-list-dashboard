<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xリスト ダイジェスト(beta)</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "Segoe UI", "Hiragino Sans", sans-serif; max-width: 960px; margin: 0 auto; padding: 12px; background: #1a1a2e; color: #e8e8e8; font-size: 16px; }
  /* headerBarはsticky(常時画面上部に固定)なので高さに上限を設けないと、フィルター
     パネル＋更新ダイジェストのドロワー(特に実行ログ)を開いた状態でビューポートより
     高くなり得る。そうなるとカード一覧側へスクロールできなくなるだけでなく、
     getStickyOffset()がheaderBar.offsetHeightを基準にスクロール先を補正している
     ため、その計算自体が破綻し、カード送り(矢印キー等)がどこにスクロールしても
     カードがヘッダーの下に隠れ続けて「戻ってこない」ように見える事故になる
     (2026-08-09発生)。max-height+内部スクロールでheaderBarの高さを常に有限に保つ。 */
  .header-bar { position: sticky; top: 0; z-index: 20; background: #1a1a2e; padding-top: 2px; margin: 0 -12px; padding-left: 12px; padding-right: 12px; max-height: min(75vh, 640px); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .header-title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; }
  h1 { font-size: 17px; margin: 0; }
  #accordionToggle { background: none; border: 1px solid #333; border-radius: 6px; color: #ccc; font-size: 14px; cursor: pointer; padding: 4px 10px; line-height: 1; flex-shrink: 0; }
  #accordionToggle:hover { background: #1a1d24; }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; padding: 10px; background: #1a1d24; border-radius: 8px; }
  .controls.collapsed { display: none; }
  .controls input[type="text"] { flex: 1 1 100%; min-width: 0; padding: 10px 12px; border-radius: 8px; border: 1px solid #333; background: #0f1115; color: #eee; font-size: 16px; }
  .controls select { padding: 8px 8px; border-radius: 8px; border: 1px solid #333; background: #0f1115; color: #eee; font-size: 15px; }
  .controls label { display: flex; align-items: center; gap: 6px; font-size: 14px; white-space: nowrap; }
  .controls input[type="checkbox"] { width: 18px; height: 18px; }
  .controls button { padding: 9px 14px; border-radius: 8px; border: 1px solid #333; background: #23272f; color: #eee; cursor: pointer; font-size: 14px; }
  .controls button:hover { background: #2c313b; }
  .controls button.primary { background: #b8860b; border-color: #b8860b; color: #111; font-weight: 600; }
  .controls button.primary:hover { background: #cc9a1c; }

  /* ---- 更新ダイジェスト（前回取得分／24H／週間の3タイル、headerBar内側）---- */
  #digest { background: #1a1d24; border: 1px solid #2c313b; border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
  /* クリック判定は行全体(#digestTitlebar / .tile)に付いており矢印だけが対象では
     ないが、見た目上は境界線付きの矢印ピルだけが「押せそう」に見えて伝わりにくい
     との指摘(2026-08-09)を受け、行全体にホバー/タップの背景ハイライトを付けて
     押せる範囲を可視化する。:activeも付けてタッチ端末でも即座に反応が見えるように。 */
  #digest .digest-titlebar { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; cursor: pointer; user-select: none; }
  #digest .digest-titlebar:hover, #digest .digest-titlebar:active { background: #23272f; }
  #digest .digest-titlebar h2 { font-size: 12.5px; font-weight: 600; margin: 0; color: #9aa0a8; letter-spacing: 0.02em; }
  #digest .digest-titlebar .caret { font-size: 11px; color: #6b7078; border: 1px solid #333; border-radius: 6px; padding: 3px 8px; transition: transform 0.15s ease; }
  #digest.collapsed .digest-body { display: none; }
  #digest.collapsed .digest-titlebar .caret { transform: rotate(-90deg); }
  #digest .digest-tiles { display: flex; flex-direction: column; gap: 1px; background: #2c313b; border-top: 1px solid #2c313b; }
  #digest .tile { background: #1a1d24; padding: 0 12px; height: 38px; cursor: pointer; user-select: none; display: flex; align-items: center; gap: 8px; overflow: hidden; }
  #digest .tile:hover, #digest .tile.open, #digest .tile:active { background: #23272f; }
  #digest .tile .t-label { font-size: 12px; color: #6b7078; white-space: nowrap; flex-shrink: 0; }
  #digest .tile .t-count { font-size: 14px; font-weight: 700; color: #e8e8e8; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #digest .tile .t-count small { font-size: 11px; font-weight: 500; color: #6b7078; margin-left: 1px; }
  #digest .tile .t-unread { font-size: 11px; color: #9aa0a8; font-variant-numeric: tabular-nums; white-space: nowrap; margin-left: auto; }
  #digest .tile .chev { font-size: 9px; color: #6b7078; flex-shrink: 0; transition: transform 0.15s ease; }
  #digest .tile.open .chev { transform: rotate(180deg); }
  #digest .drawer { border-top: 1px solid #2c313b; padding: 12px 14px 14px; display: none; background: #15171d; }
  #digest .drawer.show { display: block; }
  #digest .drawer-section { margin-bottom: 11px; }
  #digest .drawer-section:last-child { margin-bottom: 0; }
  #digest .drawer-eyebrow { font-size: 10.5px; color: #6b7078; letter-spacing: 0.06em; text-transform: uppercase; margin: 0 0 5px; }
  #digest .drawer-runs { display: flex; flex-direction: column; gap: 4px; }
  #digest .run-row { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; color: #9aa0a8; font-variant-numeric: tabular-nums; }
  #digest .run-row .run-time { color: #6cb8ff; width: 46px; flex-shrink: 0; }
  #digest .run-row .run-count { color: #e8e8e8; font-weight: 600; }
  #digest .drawer-text { font-size: 13px; line-height: 1.7; color: #e8e8e8; margin: 0; }
  #digest .drawer-empty { font-size: 12.5px; color: #6b7078; margin: 0; }
  #digest .advice-box { background: rgba(184,134,11,0.09); border: 1px solid rgba(184,134,11,0.28); border-radius: 8px; padding: 9px 11px; display: flex; gap: 8px; align-items: flex-start; }
  #digest .advice-box .advice-mark { color: #d9a521; font-size: 13px; line-height: 1.7; flex-shrink: 0; }
  #digest .advice-box p { margin: 0; font-size: 13px; line-height: 1.7; color: #e8e8e8; }
  #digest .highlight-list { display: flex; flex-direction: column; gap: 5px; }
  #digest .highlight-item { display: flex; gap: 6px; align-items: baseline; font-size: 12.5px; line-height: 1.5; color: #e8e8e8; }
  #digest .highlight-item .hi-bullet { color: #6cb8ff; flex-shrink: 0; }
  #digest .highlight-item .hi-who { color: #6b7078; flex-shrink: 0; }
  #digest .tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
  #digest .tag-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: #6cb8ff; background: rgba(108,184,255,0.1); border: 1px solid rgba(108,184,255,0.28); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
  #digest .tag-chip .tag-new { font-size: 9px; opacity: 0.85; }
  #digest .chart { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 96px; margin-bottom: 6px; }
  #digest .bar-col { display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; height: 100%; }
  #digest .bar-stack { display: flex; flex-direction: column-reverse; border-radius: 4px 4px 2px 2px; overflow: hidden; width: 100%; }
  #digest .seg-read { background: #3d84c9; }
  #digest .seg-unread { background: #7fa3c4; }
  #digest .bar-total { text-align: center; font-size: 10px; color: #6b7078; font-variant-numeric: tabular-nums; margin-bottom: 3px; }
  #digest .chart-axis { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 2px; }
  #digest .axis-label { text-align: center; font-size: 10.5px; color: #9aa0a8; }
  #digest .axis-label .dow { display: block; color: #6b7078; font-size: 9.5px; }
  #digest .axis-label.today { color: #6cb8ff; font-weight: 700; }
  #digest .chart-legend { display: flex; gap: 14px; margin-top: 9px; font-size: 11px; color: #9aa0a8; }
  #digest .chart-legend span { display: flex; align-items: center; gap: 5px; }
  #digest .legend-swatch { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  #digest .drawer-generated { font-size: 10.5px; color: #4d525a; margin: 10px 0 0; text-align: right; }

  #status { font-size: 12px; color: #888; margin-bottom: 8px; }
  #lowValueNote { font-size: 12px; color: #6cb8ff; margin: -4px 0 8px; cursor: pointer; line-height: 1.5; }
  #lowValueNote.warn { color: #ff6b6b; cursor: default; }
  .lv-badge { flex: 0 0 auto; font-size: 11px; padding: 1px 6px; border-radius: 10px; background: #3a2f12; color: #e0b34a; white-space: nowrap; }
  /* Each author's header+rows are wrapped in .group so position:sticky's
     containing block is just that group — the header stays pinned for
     exactly its own group's scroll range, then hands off to the next.
     Extra padding-bottom makes the outgoing header linger a little into
     the next group's first rows, giving a grace window to tap "mark read"
     right after finishing that author's posts. */
  .group { position: relative; padding-bottom: 36px; }
  .group-header { display: flex; align-items: center; gap: 8px; padding: 9px 12px; margin-top: 10px; background: #1a1d24; border-radius: 6px 6px 0 0; font-size: 14px; color: #ccc; position: sticky; top: var(--header-h, 0px); z-index: 10; flex-wrap: wrap; }
  .group-header .gh-name { color: #6cb8ff; font-weight: 600; }
  .group-header .gh-count { color: #888; }
  .group-header .gh-read-btn { margin-left: auto; padding: 4px 10px; border-radius: 6px; border: 1px solid #333; background: #23272f; color: #ccc; cursor: pointer; font-size: 12px; }
  .group-header .gh-read-btn:hover { background: #2c313b; }

  /* Row: mobile-first — stacked (date/star/handle on top, gist below).
     row-main uses display:contents at wider widths so it collapses into
     the outer flex row for a single-line desktop layout.
     border-left is reserved (transparent) at all times so the gray "read"
     bar appearing doesn't shift layout. */
  .row { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px 10px 9px; border-bottom: 1px solid #22252c; border-left: 3px solid transparent; cursor: pointer; font-size: 16px; }
  .row.read { border-left-color: #55595f; }
  .row.read .gist { color: #fff; }
  .row:hover { background: #1a1d24; }
  .row-main { display: flex; align-items: center; gap: 8px; }
  .row .date { color: #888; font-size: 13px; white-space: nowrap; }
  .row .star { cursor: pointer; font-size: 20px; line-height: 1; padding: 2px 4px; margin: -2px -4px; }
  .row .star.on { color: gold; }
  .row .star.off { color: #444; }
  .row .handle { color: #6cb8ff; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .row .gist { color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; text-decoration: none; }
  .row .gist:hover { text-decoration: underline; }
  .row .nogist { color: #666; font-style: italic; }

  .detail { padding: 10px 14px 16px; background: #15171d; font-size: 15px; line-height: 1.6; }
  .detail a { color: #6cb8ff; display: inline-block; margin-top: 4px; }
  .detail .tldr { font-size: 15px; color: #ddd; margin-bottom: 6px; }
  /* 音声で聞く運用が基本のため、要約文はデフォルト非表示（チェックボックスで表示切替） */
  body.summary-hidden .detail .tldr { display: none; }
  .detail-images { display: flex; gap: 8px; flex-wrap: wrap; margin: 2px 0 8px; }
  /* 画像の読み込み前後でレイアウトが動かないよう、リンク側(.detail-img-link)に
     固定の予約枠を先に確保し、画像はその中でobject-fit:containにより全体像を
     切り抜かずに表示する。カード送りは行の座標に依存するため、読み込み完了時の
     高さジャンプ(CLS)が誤送りの原因になる。 */
  .detail-images .detail-img-link { margin: 0; display: block; box-sizing: border-box; width: 96px; height: 96px; overflow: hidden; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: #1a1d24; }
  .detail-img { display: block; width: 100%; height: 100%; object-fit: contain; }
  /* サムネイルサイズ: S=96px枠 / M=192px枠(2倍) / L=カード幅いっぱい(端末幅に応じて可変、iPhoneでは約3倍相当) */
  body[data-thumb-size="m"] .detail-images .detail-img-link { width: 192px; height: 192px; }
  /* Lは縦横比が投稿ごとに違うため正確な予約はせず、緩いmin-heightで初期ジャンプ幅を抑える。
     複数枚投稿は合計の高さが膨らまないよう1枚あたりの予約を小さくする。 */
  body[data-thumb-size="l"] .detail-images .detail-img-link { flex: 1 1 100%; width: auto; height: auto; min-height: min(40vw, 240px); }
  body[data-thumb-size="l"] .detail-images.multi .detail-img-link { min-height: min(24vw, 140px); }
  body[data-thumb-size="l"] .detail-img { height: auto; max-height: min(120vw, 720px); }
  .hidden { display: none; }

  .row.active-read { background: rgba(229,62,62,0.12); box-shadow: inset 0 0 0 2px rgba(229,62,62,0.6); }

  /* 読み上げ用フローティングボタン（ホバーボタン） */
  .fab-container { position: fixed; top: 50%; right: 10px; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; z-index: 500; pointer-events: none; }
  .fab { position: relative; pointer-events: auto; width: 50px; height: 50px; border-radius: 25px; background: rgba(255,255,255,0.08); color: #6cb8ff; border: 1px solid rgba(108,184,255,0.35); box-shadow: 0 2px 8px rgba(0,0,0,0.35); display: flex; justify-content: center; align-items: center; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; font-size: 19px; transition: transform 0.12s, background 0.12s; touch-action: manipulation; }
  .fab:active { transform: scale(0.92); }
  .fab.author-nav { font-size: 15px; }
  .fab.primary { border: 2px solid #6cb8ff; }
  .fab.primary.playing { background: rgba(229,62,62,0.8); color: #fff; border-color: transparent; }
  .fab.auto-moving { background: rgba(49,130,206,0.55); color: #fff; border-color: rgba(49,130,206,0.9); }
  .fab.title-only { background: rgba(72,187,120,0.55); color: #fff; border-color: rgba(72,187,120,0.9); }
  .fab.speed { font-size: 13px; font-weight: bold; overflow: visible; }

  .speed-hover-group { position: absolute; right: 58px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: row; gap: 5px; opacity: 0; pointer-events: none; transition: opacity 0.15s ease; white-space: nowrap; }
  .speed-hover-group.visible { opacity: 1; pointer-events: auto; }
  .speed-hover-btn { width: 38px; height: 38px; border-radius: 19px; background: rgba(15,17,21,0.95); color: #6cb8ff; border: 1px solid rgba(108,184,255,0.45); box-shadow: 0 2px 8px rgba(0,0,0,0.35); display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 11px; font-weight: bold; touch-action: manipulation; }
  .speed-hover-btn.active-speed { background: #3182ce; color: #fff; border-color: #3182ce; }

  /* 「その他」ボタン（読み上げ速度・投稿者送りをここに格納し、常時表示のFAB列を短くする） */
  .fab.more { font-size: 22px; overflow: visible; }
  .more-menu { position: absolute; right: 58px; bottom: 0; display: flex; flex-direction: row; gap: 5px; opacity: 0; pointer-events: none; transition: opacity 0.15s ease; white-space: nowrap; }
  .more-menu.visible { opacity: 1; pointer-events: auto; }

  @media (min-width: 640px) {
    body { font-size: 14px; padding: 16px; }
    .header-bar { margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
    h1 { font-size: 18px; }
    .controls input[type="text"] { flex: 1; min-width: 160px; }
    .row { flex-direction: row; align-items: baseline; column-gap: 10px; padding: 7px 10px 7px 7px; font-size: 14px; }
    .row-main { display: contents; }
    .row .date { width: 64px; flex-shrink: 0; font-size: 12px; }
    .row .star { font-size: 16px; padding: 0; margin: 0; }
    .row .handle { width: 150px; flex: 0 0 150px; }
    .row .gist { flex: 1; font-size: 14px; }
    .detail { padding-left: 96px; font-size: 13px; }
    .detail .tldr { font-size: 14px; }
    #digest .digest-tiles { flex-direction: row; }
    #digest .tile { flex: 1; }
  }

  /* ================= beta: 共通 ================= */
  [hidden] { display: none !important; }
  :root { --bg: #1a1a2e; --panel: #232342; --panel2: #2b2b4d; --line: #3a3a5e; --accent: #e94560; --muted: #9a9cb8; --text: #ececf4; }
  button { font-family: inherit; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); font-size: 16px; font-weight: 600; cursor: pointer; touch-action: manipulation; }
  .btn:active { transform: scale(0.98); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.big { min-height: 72px; font-size: 20px; border-radius: 16px; width: 100%; }
  .btn[disabled] { opacity: 0.4; cursor: default; }
  .btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }

  /* タブ */
  #tabBar { position: sticky; top: 0; z-index: 30; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 0 -12px; padding: calc(6px + env(safe-area-inset-top)) 12px 6px; background: var(--bg); border-bottom: 1px solid var(--line); }
  #tabBar button { min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 15px; font-weight: 600; cursor: pointer; touch-action: manipulation; }
  #tabBar button.on { background: var(--panel2); color: #fff; box-shadow: inset 0 -3px 0 var(--accent); }
  #topBand { margin: 8px 0 0; padding: 10px 12px; border-radius: 10px; background: rgba(233,69,96,0.14); border: 1px solid rgba(233,69,96,0.45); color: #ffd9e0; font-size: 14px; line-height: 1.5; cursor: pointer; }
  #topBand[data-kind="provisional"], #topBand[data-kind="unsent"] { background: var(--panel); border-color: var(--line); color: var(--muted); }
  .tab-body { padding: 8px 0 40px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 12px 0; }
  .card h2 { font-size: 15px; margin: 0 0 8px; }
  .card .sub { font-size: 12px; color: var(--muted); }
  .muted { color: var(--muted); }
  .today-head { display: flex; align-items: center; gap: 8px; margin: 10px 0 6px; }
  .today-head h1 { flex: 1; font-size: 20px; }
  .today-head .date { color: var(--muted); font-size: 13px; }
  #listenGuide { margin: 8px 0; padding: 14px; border-radius: 12px; background: var(--panel); border: 1px dashed var(--line); color: var(--muted); font-size: 15px; line-height: 1.6; }
  #breakdown { margin: 10px 2px; font-size: 14px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
  #breakdown b { color: var(--text); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
  .stack > * + * { margin-top: 10px; }
  .topic { padding: 8px 0; border-top: 1px solid var(--line); }
  .topic:first-of-type { border-top: 0; }
  .topic b { font-size: 15px; }
  .topic p { margin: 4px 0 0; font-size: 14px; line-height: 1.6; color: #d8d8e8; }
  .holdline { width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 15px; cursor: pointer; }
  .holditem { padding: 10px 4px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: flex-start; }
  .holditem .hi-body { flex: 1; min-width: 0; }
  .holditem .hi-title { font-size: 14px; line-height: 1.5; }
  .seg-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .seg-btns button { min-height: 44px; min-width: 56px; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); font-size: 15px; cursor: pointer; }
  .seg-btns button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .tab-body:empty::before { content: "準備中"; color: var(--muted); display: block; padding: 24px 4px; }

  /* カードの点数バッジ・種類+理由 */
  .sbadge { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; min-width: 22px; height: 22px; padding: 0 5px; margin-right: 6px; border-radius: 6px; font-size: 13px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .sbadge.s5 { background: #e94560; color: #fff; }
  .sbadge.s4 { background: #a8344d; color: #fff; }
  .sbadge.s3 { background: #6d4a68; color: #e8e0ec; }

  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,

async function sbCount(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {

      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,

    },
  });
  if (!res.ok) {
    const text = await res.text().catch(() => "");
    throw new Error(`${res.status} ${text}`);

  const range = res.headers.get("content-range") || "";

  if (!iso) return "----/--/--";

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// Xの画像CDN URLの`name=`パラメータを差し替えてサイズ違いを出し分ける

function xImageVariant(url, size) {
  try {
    const u = new URL(url);
    if (!u.hostname.endsWith("twimg.com")) return url; // X以外のホストではパラメータをいじらない
    u.searchParams.set("name", size);
    return u.toString();
  } catch {
    return url;
  }
}

function olderThan24h(p) {
  const t = p.posted_at || p.fetched_at;
  if (!t) return true; // 日時不明＝新しいという根拠がないので「古い」扱い
  return (Date.now() - new Date(t).getTime()) > 24 * 60 * 60 * 1000;

const RPC_READ_MAX = 5;
async function rpcMarkRead(url, via) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/mark_read`, {

      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" },
      body: JSON.stringify({ p_url: url, p_via: via }),

  } catch (err) { return false; }
}

}

// 聴く/流すモード用: 画面全体の再描画(render)は走らせず、ローカル状態とDBだけ更新する。
// 一覧の再描画は一覧モードへ入る時にまとめて行う(listDirty)。
let listDirty = false;
async function markReadQuiet(url, via) {
  if (typeof snapMarkRead === "function") snapMarkRead(url);
  const p = allPosts.find((x) => x.post_url === url);
  if (p) { p.is_read = true; p.read_via = via; p.read_at = new Date().toISOString(); }
  listDirty = true;
  if (!(await rpcMarkRead(url, via))) {
    try { await patchIsRead([url], true); } catch (err) { console.error("read state update failed", err); return false; }
  }
  return true;
}

async function setReadState(postUrls, markRead, via = "user") {
  // 低情報フィルタで非表示の投稿も既読化できるよう、生データ(allPosts)から探す。
  const targets = postUrls.filter((u) => {
    const p = allPosts.find((p) => p.post_url === u);
    return p && p.is_read !== markRead;
  });
  if (targets.length === 0) return;
  try {
    if (markRead && targets.length <= RPC_READ_MAX) {
      const oks = await Promise.all(targets.map((u) => rpcMarkRead(u, via)));
      const failed = targets.filter((u, i) => !oks[i]);
      if (failed.length > 0) await patchIsRead(failed, true);
    } else {
      await patchIsRead(targets, markRead);
    }
    for (const u of targets) {
      const p = allPosts.find((p) => p.post_url === u);
      if (p) p.is_read = markRead;
    }
    render();
  } catch (err) {
    console.error("read state update failed", err);
  }
}

function updateHeaderHeightVar() {
  const h = document.getElementById("headerBar").offsetHeight;
  document.documentElement.style.setProperty("--header-h", `${h}px`);
}

// A row can sit under two stacked sticky elements: the page header-bar, and
// (in grouped mode) its own group's author header, which sticks right below
// the header-bar. Any scroll target for a row must clear both, or the row's
// top ends up hidden underneath the author header.
function getStickyOffset(rowEl) {
  const headerH = document.getElementById("headerBar").offsetHeight;
  const groupHeader = rowEl.closest(".group")?.querySelector(".group-header");
  return groupHeader ? headerH + groupHeader.offsetHeight : headerH;
}

function scrollRowIntoPlace(rowEl) {
  const offset = getStickyOffset(rowEl);
  const rect = rowEl.getBoundingClientRect();
  const targetTop = window.pageYOffset + rect.top - offset - 10;
  // アニメーション("smooth")は、遷移の途中でカードがヘッダーの下に隠れたり
  // 別の位置を経由したりして見え、視認性を損なうため使わない。常に瞬時移動。
  window.scrollTo({ top: targetTop, behavior: "auto" });
}

// カードへスクロールした直後は、遅延読み込み画像の完了などでリスト全体の高さが
// 動き、狙った位置から行がズレることがある。ズレたまま次のmoveCard()が
// isActiveRowVisible()を判定すると「見えていない」と誤認して、本来の次カードではなく
// 画面上部にたまたま来ている行へ飛んでしまう。リストの高さ変化(ResizeObserver)を
// 直接検知して、レイアウトが落ち着くまで今のカードを所定位置に固定し直す。
const PIN_SETTLE_MS = 1500;
let pinObserver = null;
let pinSettleTimer = null;

function releasePin() {
  if (pinObserver) { pinObserver.disconnect(); pinObserver = null; }
  if (pinSettleTimer) { clearTimeout(pinSettleTimer); pinSettleTimer = null; }
}

function pinActiveRow(url) {
  releasePin();
  if (typeof ResizeObserver === "undefined") return;
  const armSettleTimer = () => {
    if (pinSettleTimer) clearTimeout(pinSettleTimer);
    pinSettleTimer = setTimeout(releasePin, PIN_SETTLE_MS);
  };
  pinObserver = new ResizeObserver(() => {
    if (activeUrl !== url) { releasePin(); return; }
    const el = document.querySelector(`.row[data-url="${CSS.escape(url)}"]`);
    if (!el) { releasePin(); return; }
    scrollRowIntoPlace(el);
    armSettleTimer(); // 高さ変化が続く間は監視を延長し、止まってから解除する
  });
  pinObserver.observe(document.getElementById("list"));
  armSettleTimer();
}

function highlightActiveRow(scroll) {
  document.querySelectorAll(".row.active-read").forEach((el) => el.classList.remove("active-read"));
  if (!activeUrl) return;
  const rowEl = document.querySelector(`.row[data-url="${CSS.escape(activeUrl)}"]`);
  if (rowEl) {
    rowEl.classList.add("active-read");
    if (scroll) {
      // Scroll so the card lands just below the sticky header(s) (not
      // centered, and not hidden underneath them). Heights are measured live
      // so this adapts to the filter accordion state and grouped/ungrouped mode.
      scrollRowIntoPlace(rowEl);
      pinActiveRow(activeUrl);
    }
  }
}

function isActiveRowVisible() {
  if (!activeUrl) return false;
  const rowEl = document.querySelector(`.row[data-url="${CSS.escape(activeUrl)}"]`);
  if (!rowEl) return false;
  const offset = getStickyOffset(rowEl);
  const rect = rowEl.getBoundingClientRect();
  return rect.bottom > offset && rect.top < window.innerHeight;
}

function getTopVisibleIndex() {
  for (let i = 0; i < flatOrder.length; i++) {
    const rowEl = document.querySelector(`.row[data-url="${CSS.escape(flatOrder[i].post_url)}"]`);
    if (!rowEl) continue;
    const offset = getStickyOffset(rowEl);
    const rect = rowEl.getBoundingClientRect();
    if (rect.bottom > offset + 4) return i;
  }
  return flatOrder.length > 0 ? flatOrder.length - 1 : -1;
}

function resyncToVisible() {
  // If the stored active card has been scrolled out of view (user browsed
  // manually without clicking a row), snap to whichever card is actually
  // visible instead of moving further away from it. Returns true if resynced.
  if (activeUrl && isActiveRowVisible()) return false;
  const topIdx = getTopVisibleIndex();
  if (topIdx === -1) return false;
  activeUrl = flatOrder[topIdx].post_url;
  // セッションで最初にactiveUrlが確立される瞬間だけ履歴に記録する。以降の
  // resync（スクロール補正）は毎回起きるノイズなので記録しない —
  // navHistoryが空かどうかで「最初の1回」だけを見分ける。
  if (navHistory.length === 0) recordVisit(activeUrl);
  return true;
}

// --- カードナビゲーション履歴（▲▼の「戻る/進む」） ---------------------

function recordVisit(url) {
  if (!url) return;
  if (navHistory[navHistoryIndex] === url) return; // 同じ場所への再記録は無視
  // 戻った後に新しい場所へ進んだ場合、古い「進む」側の履歴は捨てる
  // （ブラウザのhistoryスタックと同じ挙動）。
  if (navHistoryIndex < navHistory.length - 1) {
    navHistory = navHistory.slice(0, navHistoryIndex + 1);
  }
  navHistory.push(url);
  navHistoryIndex = navHistory.length - 1;
  restoreUnreadOnlyIfAtFrontier();
}

// 履歴を遡って「未読のみ表示」を一時OFFにしていた場合、進んで最先端
// （フロンティア）まで追いついたら自動的に元へ戻す。
function restoreUnreadOnlyIfAtFrontier() {
  if (!historyBrowsing) return;
  if (navHistoryIndex !== navHistory.length - 1) return;
  const checkbox = document.getElementById("unreadOnly");
  checkbox.checked = historyBrowsingSavedUnread;
  historyBrowsing = false;
  historyBrowsingSavedUnread = null;
  render();
}

// 対象URLの行が今のフィルタ済みDOMに存在しない場合、「未読のみ表示」を
// 一時的に解除して出現させる（検索語や★のみ表示が原因で見つからない場合は
// 何もしない — highlightActiveRowが今まで通り黙って何もしない挙動に委ねる）。
function revealForHistoryIfNeeded(url) {
  if (document.querySelector(`.row[data-url="${CSS.escape(url)}"]`)) return;
  const checkbox = document.getElementById("unreadOnly");
  if (!checkbox.checked) return;
  if (!historyBrowsing) historyBrowsingSavedUnread = checkbox.checked;
  checkbox.checked = false;
  historyBrowsing = true;
  render();
}

// navHistory配列自体は書き換えず、postsにまだ存在するURLが見つかるまで
// カーソルだけを動かす（保持期間切れ等でpostsから消えたURLは自動的に
// 読み飛ばす）。見つからなければnullを返し、呼び出し側は既存の空間的な
// フォールバックに委ねる。
function historyStepBack() {
  let i = navHistoryIndex;
  while (i > 0) {
    i--;
    if (posts.some((p) => p.post_url === navHistory[i])) {
      navHistoryIndex = i;
      return navHistory[i];
    }
  }
  return null;
}

function historyStepForward() {
  let i = navHistoryIndex;
  while (i < navHistory.length - 1) {
    i++;
    if (posts.some((p) => p.post_url === navHistory[i])) {
      navHistoryIndex = i;
      restoreUnreadOnlyIfAtFrontier(); // フロンティアに追いついたら自動復元
      return navHistory[i];
    }
  }
  return null;
}

function groupInfoForIndex(idx) {
  let start = 0;
  for (const b of authorBoundaries) {
    if (b <= idx) start = b;
    else break;
  }
  const nextBoundary = authorBoundaries.find((b) => b > idx);
  const end = nextBoundary !== undefined ? nextBoundary : flatOrder.length;
  return { position: idx - start + 1, total: end - start };
}

function speechText(idx) {
  const grouped = document.getElementById("groupByAuthor").checked;
  const p = flatOrder[idx];
  const theme = p.gist || (p.content || "").replace(/\s+/g, " ").slice(0, 60);
  const body = p.summary || "要約はまだありません。";
  const bodyPart = readMode === 1 ? "" : `${body}`;

  if (!grouped) {
    const who = p.author_name || p.author_handle || "";
    return `${who}。${theme}。${bodyPart}`;
  }

  const info = groupInfoForIndex(idx);
  let prefix = "";
  if (info.position === 1) {
    const who = p.author_name || p.author_handle || "";
    prefix = `${who} ${info.total}件の投稿です。`;
  }
  return `${prefix}${info.position}. ${theme}。${bodyPart}`;
}

function speakCurrent() {
  window.speechSynthesis.cancel();
  if (flatOrder.length === 0) return;
  let idx = flatOrder.findIndex((p) => p.post_url === activeUrl);
  if (idx === -1) {
    idx = 0;
    activeUrl = flatOrder[idx].post_url;
    highlightActiveRow(true);
    recordVisit(activeUrl);
  }
  const spokenUrl = flatOrder[idx].post_url;
  const utter = new SpeechSynthesisUtterance(speechText(idx));
  utter.lang = "ja-JP";
  utter.rate = currentSpeedRate;
  utter.onend = async () => {
    const curIdx = flatOrder.findIndex((pp) => pp.post_url === activeUrl);
    // Auto-advance skips over already-read cards instead of stopping on each one:
    // grouped "unread only" view keeps read cards on screen (so you can scroll back
    // to them), but there's no reason to read them aloud again. Manual ▲▼ navigation
    // is unaffected — it still moves one card at a time regardless of read state.
    let nextUrl = null;
    if (isPlaying) {
      for (let i = curIdx + 1; i < flatOrder.length; i++) {
        if (!flatOrder[i].is_read) { nextUrl = flatOrder[i].post_url; break; }
      }
    }
    // Mark read only after the card has actually finished being read aloud —
    // marking it up front would make it vanish from an "unread only" filtered
    // view before playback even starts. Wait for the render() this triggers
    // to settle before scrolling to the next card: that render() can drop
    // the just-finished card from an "unread only" view, shrinking the list,
    // so scrolling before it settles can leave the next card shifted up
    // underneath the sticky header.
    await markAsRead([spokenUrl]);
    if (!isPlaying) return;
    if (nextUrl) {
      activeUrl = nextUrl;
      highlightActiveRow(true);
      recordVisit(activeUrl);
      speakCurrent();
    } else {
      isPlaying = false;
      updatePlayButton();
    }
  };
  window.speechSynthesis.speak(utter);
}

function updatePlayButton() {
  const btn = document.getElementById("btnPlayPause");
  btn.textContent = isPlaying ? "⏸️" : "▶️";
  btn.classList.toggle("playing", isPlaying);
}

function moveCard(delta) {
  if (flatOrder.length === 0) return;
  if (resyncToVisible()) {
    highlightActiveRow(true);
    if (isPlaying) speakCurrent();
    return "resynced";
  }
  const prevUrl = activeUrl;

  // 履歴を遡る: 未読のみ表示＋グループ化で投稿者グループが全既読になり
  // 画面から消えていても、実際に訪れたカードへ▲で戻れるようにする。
  if (delta < 0 && navHistoryIndex > 0) {
    const url = historyStepBack();
    if (url) {
      revealForHistoryIfNeeded(url);
      activeUrl = url;
      highlightActiveRow(true);
      // 履歴の閲覧は「読み直し」ではないので既読化しない。ただし読み上げ中の
      // 離脱は既存仕様通り既読化する(課題5の不変条件を壊さない)。
      if (prevUrl && isPlaying) markAsRead([prevUrl]);
      if (isPlaying) speakCurrent();
      return;
    }
    // 履歴が尽きている(purge済み含む)場合は下の空間的フォールバックへ。
  }

  // 履歴を辿って進む: まだフロンティアに追いついていない間は記録済みの
  // 順路をそのまま再生する。
  if (delta > 0 && navHistoryIndex < navHistory.length - 1) {
    const url = historyStepForward();
    if (url) {
      activeUrl = url;
      highlightActiveRow(true);
      if (prevUrl) markAsRead([prevUrl]); // 既読済みなら実質no-op
      if (isPlaying) speakCurrent();
      return;
    }
  }

  let idx = flatOrder.findIndex((p) => p.post_url === activeUrl);
  if (idx === -1) idx = delta > 0 ? -1 : 0;
  idx = Math.min(Math.max(idx + delta, 0), flatOrder.length - 1);
  activeUrl = flatOrder[idx].post_url;
  highlightActiveRow(true);
  // 課題4: 前進移動は常に離脱カードを既読化(クリック/キーボード/自動送り共通)
  // 課題5: 読み上げ中は方向を問わず離脱(＝読み上げ中断)カードを既読化
  if (prevUrl && (delta > 0 || isPlaying)) {
    const movedToUrl = activeUrl;
    // markAsRead()が引き起こすrender()は、既読で消えた投稿者グループの分だけ
    // スクロール位置と実際の表示がずれる(render()自体はscroll:falseで呼ばれるため)。
    // このズレがisActiveRowVisible()を誤らせ、次の1クリックがresyncToVisible()に
    // 食われて「反応しない」ように見える原因だった。render()確定後にもう一度だけ
    // 現在地へスクロールし直して補正する(その間に別のカードへ移動済みなら何もしない)。
    markAsRead([prevUrl]).then(() => {
      if (activeUrl === movedToUrl) highlightActiveRow(true);
    });
  }
  // 前進で新しい場所へ着いた場合のみ履歴に記録する(戻る側のフォールバックは
  // 記録しない — navHistoryIndexが現在地とズレたまま進んだ扱いになると、
  // 次の「進む」操作が全く違うカードへ飛ぶ不具合になるため)。
  if (delta > 0) recordVisit(activeUrl);
  if (isPlaying) speakCurrent();
}

function moveAuthor(delta) {
  if (flatOrder.length === 0 || authorBoundaries.length === 0) return;
  if (autoMoveDirection !== 0) stopAutoMove();
  if (resyncToVisible()) {
    highlightActiveRow(true);
    if (isPlaying) speakCurrent();
    return;
  }
  let idx = flatOrder.findIndex((p) => p.post_url === activeUrl);
  if (idx === -1) idx = 0;
  let newIdx;
  if (delta > 0) {
    const next = authorBoundaries.find((b) => b > idx);
    newIdx = next !== undefined ? next : flatOrder.length - 1;
  } else {
    const prevCandidates = authorBoundaries.filter((b) => b < idx);
    newIdx = prevCandidates.length ? prevCandidates[prevCandidates.length - 1] : 0;
  }
  activeUrl = flatOrder[newIdx].post_url;
  highlightActiveRow(true);
  recordVisit(activeUrl);
  if (isPlaying) speakCurrent();
}

function setSpeed(v) {
  currentSpeedRate = v;
  const btn = document.getElementById("btnSpeed");
  const textNode = Array.from(btn.childNodes).find((n) => n.nodeType === Node.TEXT_NODE);
  if (textNode) textNode.textContent = `${v}x`;
  buildSpeedHoverGroup();
  if (isPlaying) speakCurrent();
}

// 課題3: 長押しによる無音自動カード送り。読み上げ速度(x1〜x3)に応じて
// カード滞在時間を線形補間する: x1→2000ms, x2→1500ms, x3→1000ms。
function dwellMs(speed) {
  return 2000 - 500 * (speed - 1);
}

// resyncToVisible()がスクロール位置の一時的なズレのせいで「たまたま同じカードに
// 巻き戻す」ことがあり、これを本当にリスト末尾に到達したのと区別できないと
// 自動移動が途中で誤って止まってしまう。数回だけ様子を見てから諦める。
let autoMoveStallCount = 0;
const AUTO_MOVE_MAX_STALLS = 3;

function stopAutoMove() {
  if (autoMoveTimerHandle) { clearTimeout(autoMoveTimerHandle); autoMoveTimerHandle = null; }
  document.getElementById("btnCardPrev").classList.remove("auto-moving");
  document.getElementById("btnCardNext").classList.remove("auto-moving");
  autoMoveDirection = 0;
  autoMoveStallCount = 0;
}

function scheduleAutoMoveStep() {
  autoMoveTimerHandle = setTimeout(autoMoveStep, dwellMs(currentSpeedRate));
}

function autoMoveStep() {
  if (autoMoveDirection === 0 || flatOrder.length === 0) { stopAutoMove(); return; }
  const before = activeUrl;
  const result = moveCard(autoMoveDirection);
  if (activeUrl === before) {
    // resyncToVisible()由来の「進んでいない」は、スクロールのズレが原因の誤検知
    // かもしれないので即座には諦めない。次のtickで解消されることが多い。
    if (result === "resynced" && autoMoveStallCount < AUTO_MOVE_MAX_STALLS) {
      autoMoveStallCount++;
      scheduleAutoMoveStep();
      return;
    }
    stopAutoMove(); // 本当に端に到達、これ以上動かない
    return;
  }
  autoMoveStallCount = 0;
  if (autoMoveDirection > 0) {
    const cur = flatOrder.find((p) => p.post_url === activeUrl);
    if (cur && cur.is_read) { autoMoveStep(); return; } // 既読カードは待たずスキップ
  }
  scheduleAutoMoveStep();
}

function startAutoMove(direction, btnEl) {
  stopAutoMove();
  if (isPlaying) { // 音声モードとは排他
    isPlaying = false;
    window.speechSynthesis.cancel();
    updatePlayButton();
  }
  autoMoveDirection = direction;
  btnEl.classList.add("auto-moving");
  scheduleAutoMoveStep();
}

function setupCardLongPress(btnEl, direction) {
  let pressTimer = null;
  let longPressed = false;
  btnEl.addEventListener("pointerdown", () => {
    longPressed = false;
    pressTimer = setTimeout(() => { longPressed = true; startAutoMove(direction, btnEl); }, 450);
  });
  btnEl.addEventListener("pointerup", () => {
    clearTimeout(pressTimer);
    if (longPressed) return;
    if (autoMoveDirection === direction) { stopAutoMove(); return; } // 同じ矢印を再タップ→停止
    if (autoMoveDirection !== 0) stopAutoMove(); // 逆方向タップ→自動送り解除して単発移動
    moveCard(direction);
  });
  btnEl.addEventListener("pointerleave", () => clearTimeout(pressTimer));
}

function buildSpeedHoverGroup() {
  const group = document.getElementById("speedHoverGroup");
  group.innerHTML = "";
  for (const v of speedOptions) {
    const btn = document.createElement("div");
    btn.className = "speed-hover-btn" + (Math.abs(v - currentSpeedRate) < 0.01 ? " active-speed" : "");
    btn.textContent = `${v}x`;
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      setSpeed(v);
      document.getElementById("speedHoverGroup").classList.remove("visible");
    });
    group.appendChild(btn);
  }
}

function restoreFilterState() {
  try {
    const unread = localStorage.getItem(LS_KEY_UNREAD_ONLY);
    if (unread !== null) document.getElementById("unreadOnly").checked = unread === "true";
    // 未設定(初回訪問)ならチェックボックスの初期値どおりOFF=非表示のまま
    const showSummary = localStorage.getItem(LS_KEY_SHOW_SUMMARY);
    if (showSummary !== null) document.getElementById("showSummary").checked = showSummary === "true";
    document.body.classList.toggle("summary-hidden", !document.getElementById("showSummary").checked);
    const sort = localStorage.getItem(LS_KEY_GROUP_SORT);
    const validSorts = ["count_desc", "count_asc", "name_asc", "name_desc"];
    if (sort !== null && validSorts.includes(sort)) document.getElementById("groupSort").value = sort;
    const postSort = localStorage.getItem(LS_KEY_POST_SORT);
    const validPostSorts = ["posted_desc", "posted_asc"];
    if (postSort !== null && validPostSorts.includes(postSort)) document.getElementById("postSort").value = postSort;
    const thumbSize = localStorage.getItem(LS_KEY_THUMB_SIZE);
    const validThumbSizes = ["s", "m", "l"];
    if (thumbSize !== null && validThumbSizes.includes(thumbSize)) document.getElementById("thumbSize").value = thumbSize;
    document.body.dataset.thumbSize = document.getElementById("thumbSize").value;
    const lowValueMode = localStorage.getItem(LS_KEY_LOW_VALUE);
    const validLowValueModes = ["hide", "include", "only"];
    if (lowValueMode !== null && validLowValueModes.includes(lowValueMode)) document.getElementById("lowValueMode").value = lowValueMode;
  } catch (err) { /* localStorage不可(プライベートモード等) — デフォルト値のまま続行 */ }
}

function saveFilterState() {
  try {
    localStorage.setItem(LS_KEY_UNREAD_ONLY, String(document.getElementById("unreadOnly").checked));
    localStorage.setItem(LS_KEY_SHOW_SUMMARY, String(document.getElementById("showSummary").checked));
    localStorage.setItem(LS_KEY_GROUP_SORT, document.getElementById("groupSort").value);
    localStorage.setItem(LS_KEY_POST_SORT, document.getElementById("postSort").value);
    localStorage.setItem(LS_KEY_THUMB_SIZE, document.getElementById("thumbSize").value);
    localStorage.setItem(LS_KEY_LOW_VALUE, document.getElementById("lowValueMode").value);
  } catch (err) { /* ignore */ }
}

// 更新ダイジェスト（前回取得分／24H／週間）の開閉状態は、投稿データの
// 再読込とは無関係な純粋なUI状態なので、restoreFilterStateには混ぜず
// 独立させてスクリプト初期化時に一度だけ適用する。
function restoreDigestState() {
  try {
    const open = localStorage.getItem(LS_KEY_DIGEST_OPEN);
    if (open !== null) {
      document.getElementById("digest").classList.toggle("collapsed", open === "false");
      document.getElementById("digestCaret").textContent = open === "false" ? "▼ 開く" : "▲ 閉じる";
    }
    const tileRaw = localStorage.getItem(LS_KEY_DIGEST_TILE);
    if (tileRaw) {
      const parsed = JSON.parse(tileRaw);
      for (const key of ["last_run", "24h", "7d"]) {
        if (typeof parsed[key] === "boolean") digestTileOpen[key] = parsed[key];
      }
    }
  } catch (err) { /* localStorage不可(プライベートモード等) — デフォルト値のまま続行 */ }
  applyDigestTileState();
}

function saveDigestState() {
  try {
    const collapsed = document.getElementById("digest").classList.contains("collapsed");
    localStorage.setItem(LS_KEY_DIGEST_OPEN, String(!collapsed));
    localStorage.setItem(LS_KEY_DIGEST_TILE, JSON.stringify(digestTileOpen));
  } catch (err) { /* ignore */ }
}

function applyDigestTileState() {
  document.querySelectorAll("#digest .tile").forEach((tile) => {
    const key = tile.dataset.tile;
    const open = digestTileOpen[key];
    tile.classList.toggle("open", open);
    document.querySelector(`.drawer[data-drawer="${key}"]`).classList.toggle("show", open);
  });
}

function fmtTimeHHMM(iso) {
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

// タイルの件数・未読数は`posts`配列から数えない。load()の投稿取得クエリは
// PostgRESTの既定行数上限(実測1000行)に達しており、7日窓だけで実件数の
// 約半分しかメモリに載っていないケースを確認済み。件数はsbCountで都度
// 個別に問い合わせる。
async function loadDigest() {
  try {
    const [runsData, summariesData] = await Promise.all([
      sbFetch(`fetch_runs?select=*&order=finished_at.desc&limit=20`),
      sbFetch(`digest_summaries?select=*`),
    ]);
    const runs = runsData || [];
    const summaries = {};
    for (const s of summariesData || []) summaries[s.period_type] = s;
    const lastRun = runs[0] || null;

    const since24h = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
    const since7d = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();
    // Postgresが返すタイムスタンプ文字列は"+00:00"のようなオフセットを含む。
    // encodeURIComponentせずクエリ文字列に埋め込むと"+"が(application/x-www-form-urlencoded
    // の慣習で)スペースとして解釈され、PostgREST側で日時パースエラー(400)になる
    // （実際にこれで前回/24H/週間の全タイルが巻き込まれて空になる事故が発生した）。
    const enc = encodeURIComponent;
    const filter24h = `or=(posted_at.gte.${enc(since24h)},and(posted_at.is.null,fetched_at.gte.${enc(since24h)}))`;
    const filter7d = `or=(posted_at.gte.${enc(since7d)},and(posted_at.is.null,fetched_at.gte.${enc(since7d)}))`;

    const keys = ["count24h", "unread24h", "count7d", "unread7d", "unreadLastRun"];
    const promises = [
      sbCount(`x_posts?select=id&${filter24h}`),
      sbCount(`x_posts?select=id&${filter24h}&is_read=eq.false`),
      sbCount(`x_posts?select=id&${filter7d}`),
      sbCount(`x_posts?select=id&${filter7d}&is_read=eq.false`),
      lastRun
        ? sbCount(`x_posts?select=id&fetched_at=gte.${enc(lastRun.started_at)}&fetched_at=lte.${enc(lastRun.finished_at)}&is_read=eq.false`)
        : Promise.resolve(0),
    ];
    // allSettledで個別に失敗を吸収する — 1つのクエリが失敗しても、他のタイルまで
    // 巻き込んで空表示になることがないようにする（今回の事故の再発防止）。
    const settled = await Promise.allSettled(promises);
    const counts = {};
    keys.forEach((k, i) => {
      const r = settled[i];
      if (r.status === "rejected") console.error(`digest count failed (${k})`, r.reason);
      counts[k] = r.status === "fulfilled" ? r.value : 0;
    });

    digestData = { runs, summaries, lastRun, counts, since24h };
    renderDigest();
  } catch (err) {
    console.error("digest load failed", err);
  }
}

function renderDigest() {
  if (!digestData) return;
  const { runs, summaries, lastRun, counts } = digestData;

  const tileLast = document.querySelector('.tile[data-tile="last_run"]');
  if (lastRun) {
    tileLast.querySelector(".t-count").innerHTML = `${lastRun.new_post_count}<small>件</small>`;
    tileLast.querySelector(".t-unread").textContent = lastRun.new_post_count > 0 ? `未読${counts.unreadLastRun}` : "";
  } else {
    tileLast.querySelector(".t-count").textContent = "–";
    tileLast.querySelector(".t-unread").textContent = "";
  }

  const tile24h = document.querySelector('.tile[data-tile="24h"]');
  tile24h.querySelector(".t-count").innerHTML = `${counts.count24h}<small>件</small>`;
  tile24h.querySelector(".t-unread").textContent = `未読${counts.unread24h}`;

  const tile7d = document.querySelector('.tile[data-tile="7d"]');
  tile7d.querySelector(".t-count").innerHTML = `${counts.count7d}<small>件</small>`;
  tile7d.querySelector(".t-unread").textContent = `未読${counts.unread7d}`;

  renderLastRunDrawer(lastRun, summaries.last_run, counts.unreadLastRun);
  render24hDrawer(runs, summaries["24h"]);
  render7dDrawer(summaries["7d"]);
  if (typeof onDigestRendered === "function") onDigestRendered(); // beta: 取得遅れの帯
}

// --- 低情報投稿(意味のない極短文・本文なし)の表示フィルタ -------------------
// DB・要約側は変更せず、表示側だけで判定する(物理削除はしない)。理由コードは将来DBに
// 列 low_value_reason(案B)を足すときと同じ文字列にしてあり、列があればそれを優先する。
// 保守的なルール(誤って隠すと情報が静かに消え、誤って残しても読み上げが約2秒延びるだけ):
//   empty        本文が空で画像もない
//   short_ref    URL除去後14字以内・画像なし・要約=原文コピーで、参照語(こちら/詳細/リンク等)だけ
//   short_repeat 同上で、同一投稿者の同一本文が3件以上
//   short_tiny   同上で、4字以内かつ英数字を含まない(「草」「おおー」など)
// 画像付き・スター付きは常に残す。判定でエラーが出た投稿も残す(fail-open)。
// LV-BEGIN
const LV_VERSION = 1;
const LV_SHORT_MAX = 14;
const LV_AUTO_DISABLE_RATE = 0.2;    // 非表示率がこれを超えたら取得側の異常とみなしフィルタを自動停止
const LV_AUTO_DISABLE_MIN_POSTS = 50;
const LV_REF_ONLY = /^(こちら|詳細|詳しく|参照|参考|元|リンク|続き|記事|note|ノート|あとで|後で|読む|読み|チェック|前回|話|まで|から|ぜひ|是非|活用|よろしく|ご|お|は|を|も|で|に|が|の|です|ます|ください|下さい)+$/i;
const LV_LABELS = { empty: "本文なし", short_ref: "参照のみ", short_repeat: "同文の繰り返し", short_tiny: "極短文" };

function lvNormalize(s) { return String(s ?? "").normalize("NFKC").replace(/\s+/g, " ").trim(); }
function lvText(p) { return lvNormalize(String(p.content ?? "").replace(/https?:\/\/\S+/g, "")); }
function lvHasImages(p) { return Array.isArray(p.image_urls) && p.image_urls.length > 0; }
function lvIsShortEcho(p) {
  const len = [...lvText(p)].length;
  return len >= 1 && len <= LV_SHORT_MAX && lvNormalize(p.summary) === lvNormalize(p.content);
}
function lvRepeatKey(p) { return lvNormalize(p.author_handle) + "\u0000" + lvText(p); }

function classifyLowValue(p, repeatCounts) {
  if (p.low_value_reason) return { rule: p.low_value_reason, version: LV_VERSION };
  if (p.is_starred || lvHasImages(p)) return null;
  if (String(p.content ?? "").trim() === "") return { rule: "empty", version: LV_VERSION };
  if (!lvIsShortEcho(p)) return null;
  const text = lvText(p);
  const compact = text.replace(/[\p{P}\p{S}\s]/gu, "");
  if (compact && LV_REF_ONLY.test(compact)) return { rule: "short_ref", version: LV_VERSION };
  if ((repeatCounts.get(lvRepeatKey(p)) || 0) >= 3) return { rule: "short_repeat", version: LV_VERSION };
  if ([...text].length <= 4 && !/[A-Za-z0-9]/.test(text)) return { rule: "short_tiny", version: LV_VERSION };
  return null;
}

// 生データ全体を判定し、{info: post_url→rule, stats} を返す。
function computeLowValue(rawPosts) {
  const info = new Map();
  const stats = { total: rawPosts.length, hidden: 0, byRule: {}, autoDisabled: false, rate: 0 };
  const counts = new Map();
  for (const p of rawPosts) {
    try {
      if (!p.is_starred && !lvHasImages(p) && lvIsShortEcho(p)) {
        const k = lvRepeatKey(p);
        counts.set(k, (counts.get(k) || 0) + 1);
      }
    } catch (err) { /* fail-open */ }
  }
  for (const p of rawPosts) {
    try {
      const r = classifyLowValue(p, counts);
      if (r) {
        info.set(p.post_url, r.rule);
        stats.byRule[r.rule] = (stats.byRule[r.rule] || 0) + 1;
        stats.hidden++;
      }
    } catch (err) { /* fail-open: 判定できない投稿は残す */ }
  }
  stats.rate = stats.total ? stats.hidden / stats.total : 0;
  if (stats.total >= LV_AUTO_DISABLE_MIN_POSTS && stats.rate > LV_AUTO_DISABLE_RATE) {
    stats.autoDisabled = true;
    info.clear();
  }
  return { info, stats };
}
// LV-END

const LV_DISABLED = (() => { try { return new URLSearchParams(location.search).get("lv") === "off"; } catch { return false; } })();
let lowValueInfo = new Map(); // post_url -> rule(判定は読み込み時と切替時のみ。星を外しても再読込まで再判定しない)
let lowValueStats = { total: 0, hidden: 0, byRule: {}, autoDisabled: false, rate: 0 };

function lvMode() {
  const el = document.getElementById("lowValueMode");
  return el ? el.value : "hide";
}

function recomputeVisiblePosts() {
  let result = { info: new Map(), stats: { total: allPosts.length, hidden: 0, byRule: {}, autoDisabled: false, rate: 0 } };
  if (!LV_DISABLED) {
    try { result = computeLowValue(allPosts); } catch (err) { console.warn("low-value filter failed; showing everything", err); }
  }
  lowValueInfo = result.info;
  lowValueStats = result.stats;
  const mode = lvMode();
  if (mode === "only") posts = allPosts.filter((p) => lowValueInfo.has(p.post_url));
  else if (mode === "hide" && lowValueInfo.size > 0) posts = allPosts.filter((p) => !lowValueInfo.has(p.post_url));
  else posts = allPosts;
  updateLowValueNote();
}

function updateLowValueNote() {
  const el = document.getElementById("lowValueNote");
  if (!el) return;
  const s = lowValueStats;
  const mode = lvMode();
  const detail = Object.entries(s.byRule).map(([r, n]) => `${LV_LABELS[r] || r}${n}`).join("・");
  el.className = "";
  if (LV_DISABLED) {
    el.className = "warn";
    el.textContent = "低情報フィルタ: 停止中（?lv=off）";
    el.hidden = false;
  } else if (s.autoDisabled) {
    el.className = "warn";
    el.textContent = `低情報が${Math.round(s.rate * 100)}%（${s.hidden}件）と多すぎるため、フィルタを自動停止しました（取得側の異常の可能性）`;
    el.hidden = false;
  } else if (s.hidden === 0) {
    el.hidden = true;
  } else if (mode === "hide") {
    el.textContent = `低情報${s.hidden}件を非表示（${detail}）・タップで確認　※上部ダイジェストの件数には含まれます`;
    el.hidden = false;
  } else if (mode === "only") {
    el.textContent = `低情報のみ表示中（${s.hidden}件：${detail}）・タップで隠す`;
    el.hidden = false;
  } else {
    el.textContent = `低情報${s.hidden}件を含めて表示中（理由バッジ付き）・タップで隠す`;
    el.hidden = false;
  }
}

function applyLowValueMode() {
  recomputeVisiblePosts();
  document.getElementById("status").textContent = `${posts.length}件`;
  saveFilterState();
  render();
}

async function load() {
  // 再読込でpostsが総入れ替えされた後に古いナビゲーション履歴が残らないように。
  navHistory = [];
  navHistoryIndex = -1;
  historyBrowsing = false;
  historyBrowsingSavedUnread = null;
  restoreFilterState();
  document.getElementById("status").textContent = "読み込み中...";
  const oneMonthAgo = new Date(Date.now() - 30*24*60*60*1000).toISOString();
  const filter = `or=(posted_at.gte.${oneMonthAgo},posted_at.is.null)`;
  try {
    const data = await sbFetch(`x_posts?select=*&${filter}&order=fetched_at.desc`);
    allPosts = data || [];
    recomputeVisiblePosts();
    document.getElementById("status").textContent = `${posts.length}件`;
    render();
    loadDigest(); // 独自にtry/catchを持つ非同期処理。失敗してもメイン一覧の表示は巻き込まない。
    if (typeof onPostsLoaded === "function") onPostsLoaded(); // beta: 今日タブの再計算
  } catch (err) {
    document.getElementById("status").textContent = "読み込みエラー: " + err.message;
    if (typeof onPostsLoaded === "function") onPostsLoaded(); // beta: 端末に確保済みの聴き残しは通信できなくても出す
  }
}

// render()は毎回リスト全体を作り直すため、新品の<img>は読み込み直しが終わるまで表示されず、
// カード移動のたびに画面が一瞬ちらつく(Lサイズではページ高さも縮んで別カードの画像が映る)。
// 作り直す直前に読み込み済みの<img>を退避し、同じ画像(data-kとsrcが一致)なら新品と入れ替えて
// 使い回す。処理の流れ(render()が唯一の描画元)は変えないので、表示と状態がズレる心配はない。
// ?fullrender=1 で従来どおり全て作り直す(iPhone実機で問題が出た場合の切り分け用)。
const FULL_RENDER = (() => { try { return new URLSearchParams(location.search).get("fullrender") === "1"; } catch { return false; } })();
let imgReuse = null; // render()中だけ有効: data-k -> 読み込み済みの<img>

function collectLoadedImages(listEl) {
  const map = new Map();
  if (FULL_RENDER) return map;
  for (const img of listEl.querySelectorAll("img.detail-img[data-k]")) {
    if (img.complete && img.naturalWidth > 0) map.set(img.dataset.k, img); // 読み込み失敗・途中のものは再利用しない
  }
  return map;
}

function reuseLoadedImages(detail) {
  if (!imgReuse || imgReuse.size === 0) return;
  for (const fresh of detail.querySelectorAll("img.detail-img[data-k]")) {
    const old = imgReuse.get(fresh.dataset.k);
    if (old && old.getAttribute("src") === fresh.getAttribute("src")) fresh.replaceWith(old);
  }
}

// 低情報を表示している間(含める/低情報のみ)だけ、なぜ低情報と判定されたかをバッジで示す。
function lowValueBadgeHtml(p) {
  const rule = lowValueInfo.get(p.post_url);
  if (!rule || lvMode() === "hide") return "";
  return ` <span class="lv-badge">${escapeHtml(LV_LABELS[rule] || rule)}</span>`;
}

// ---- beta: カードの点数バッジ・種類+理由行・暫定チップ(一覧/聴く/流す/保留で共通) ----
const KIND_LABELS = { duplicate: "重複", announce: "告知宣伝", ref_only: "参照のみ", primary: "一次情報", news: "新発表", numbers: "数値・比較", howto: "手順・実践", explain: "解説", opinion: "意見・感想" };
const PROVISIONAL_MODEL_RE = /2\.5/; // 暫定=2.5系モデルでの採点(本番モデルへ切り替わるまで)
function isProvisional(p) { return p.score != null && p.score_state === "scored" && PROVISIONAL_MODEL_RE.test(String(p.scored_model || "")); }
function scoreNum(p) {
  if (p.score === null || p.score === undefined || p.score === "") return null;
  const n = Math.round(Number(p.score));
  return Number.isFinite(n) ? Math.min(5, Math.max(1, n)) : null;
}
function scoreBadgeHtml(p) {

function kindLineHtml(p) {

function buildRow(p) {
  const row = document.createElement("div");
  row.className = "row" + (p.is_read ? " read" : "");
  row.dataset.url = p.post_url;
  const hasGist = !!p.gist;
  const gistText = p.gist || (p.content || "").replace(/\s+/g, " ").slice(0, 60);
  row.innerHTML = `
    <div class="row-main">
      <span class="date">${fmtDate(p.posted_at || p.fetched_at)}</span>

  `;
  const detail = document.createElement("div");
  detail.className = "detail" + (collapsedUrls.has(p.post_url) ? " hidden" : "");
  const images = Array.isArray(p.image_urls) ? p.image_urls : [];
  const imagesHtml = images.length > 0 ? `

  `;
  reuseLoadedImages(detail);
  row.addEventListener("click", (e) => {
    if (e.target.classList.contains("star")) return;
    if (autoMoveDirection !== 0) stopAutoMove();
    const isHidden = detail.classList.toggle("hidden");
    if (isHidden) collapsedUrls.add(p.post_url);
    else collapsedUrls.delete(p.post_url);
    activeUrl = p.post_url;
    highlightActiveRow(false);
  });
  row.querySelector(".star").addEventListener("click", async (e) => {
    e.stopPropagation();
    const newVal = !p.is_starred;
    try {
      await sbFetch(`x_posts?post_url=eq.${encodeURIComponent(p.post_url)}`, {
        method: "PATCH",

function render() {
  const starOnly = document.getElementById("starOnly").checked;
  const unreadOnly = document.getElementById("unreadOnly").checked;
  const grouped = document.getElementById("groupByAuthor").checked;
  const groupSort = document.getElementById("groupSort").value;
  const postSort = document.getElementById("postSort").value;
  const q = document.getElementById("search").value.trim().toLowerCase();
  const listEl = document.getElementById("list");
  imgReuse = collectLoadedImages(listEl); // 全消去の前に、読み込み済みの画像を退避
  listEl.innerHTML = "";

  authorBoundaries = [];

  const unreadCount = posts.filter(p => !p.is_read).length;
  document.getElementById("pageTitle").textContent = `Xリスト ダイジェスト（未読 ${unreadCount}件）`;
  document.getElementById("markAllRead").textContent = (posts.length > 0 && unreadCount === 0) ? "すべて未読に戻す" : "すべて既読";

  const scopedOld = posts.filter(olderThan24h);
  const scopedOldAllRead = scopedOld.length > 0 && scopedOld.every((p) => p.is_read);
  document.getElementById("mark24hRead").textContent = scopedOldAllRead
    ? "24H以前を未読に戻す"
    : `24H以前全既読(${scopedOld.filter((p) => !p.is_read).length}件)`;

  document.getElementById("groupSort").disabled = !grouped;

  const baseFiltered = posts.filter(p => {
    if (starOnly && !p.is_starred) return false;
    if (q && !((p.content||"").toLowerCase().includes(q) || (p.author_handle||"").toLowerCase().includes(q) || (p.author_name||"").toLowerCase().includes(q))) return false;
    return true;
  });

  let filtered;
  if (unreadOnly && grouped) {
    // Keep a whole author group on screen (including cards already marked read)
    // until every post in it is read. Otherwise a card vanishes the instant it's
    // read mid-group, shifting the rest of the group up and making it impossible
    // to scroll back to something you just passed.
    const unreadAuthors = new Set(baseFiltered.filter(p => !p.is_read).map(p => p.author_handle || "(unknown)"));
    filtered = baseFiltered.filter(p => unreadAuthors.has(p.author_handle || "(unknown)"));
  } else if (unreadOnly) {
    filtered = baseFiltered.filter(p => !p.is_read);
  } else {
    filtered = baseFiltered;
  }

  // 投稿の並び順は常にposted_at基準(取得順のfetched_atではない)。
  // グループ化時もグループ内の並びに同じ基準を使う。
  filtered = filtered.slice().sort((a, b) => {
    const ta = a.posted_at ? new Date(a.posted_at).getTime() : -Infinity;
    const tb = b.posted_at ? new Date(b.posted_at).getTime() : -Infinity;
    return postSort === "posted_asc" ? ta - tb : tb - ta;
  });

  if (!grouped) {
    for (const p of filtered) {
      const { row, detail } = buildRow(p);
      listEl.appendChild(row);
      listEl.appendChild(detail);
      if (flatOrder.length === 0 || flatOrder[flatOrder.length-1].author_handle !== p.author_handle) {
        authorBoundaries.push(flatOrder.length);
      }
      flatOrder.push(p);
    }
    imgReuse = null;
    updateHeaderHeightVar();
    highlightActiveRow(false);
    return;
  }

  const groups = new Map();
  for (const p of filtered) {
    const key = p.author_handle || "(unknown)";
    if (!groups.has(key)) groups.set(key, { author_handle: p.author_handle, author_name: p.author_name, posts: [] });
    groups.get(key).posts.push(p);
  }

  let groupList = Array.from(groups.values());
  groupList.sort((a, b) => {
    if (groupSort === "count_desc") return b.posts.length - a.posts.length;
    if (groupSort === "count_asc") return a.posts.length - b.posts.length;
    if (groupSort === "name_asc") return (a.author_handle||"").localeCompare(b.author_handle||"");
    if (groupSort === "name_desc") return (b.author_handle||"").localeCompare(a.author_handle||"");
    return 0;
  });

  for (const g of groupList) {
    const groupEl = document.createElement("div");
    groupEl.className = "group";

    const allRead = g.posts.every((p) => p.is_read);
    const header = document.createElement("div");
    header.className = "group-header";
    header.innerHTML = `<span class="gh-name">${escapeHtml(g.author_handle)}</span> <span>${escapeHtml(g.author_name||"")}</span> <span class="gh-count">${g.posts.length}件</span> <button class="gh-read-btn">${allRead ? "未読に戻す" : "既読にする"}</button>`;
    header.querySelector(".gh-read-btn").addEventListener("click", () => {
      setReadState(g.posts.map((p) => p.post_url), !allRead);
    });
    groupEl.appendChild(header);
    authorBoundaries.push(flatOrder.length);
    for (const p of g.posts) {
      const { row, detail } = buildRow(p);
      groupEl.appendChild(row);
      groupEl.appendChild(detail);
      flatOrder.push(p);
    }
    listEl.appendChild(groupEl);
  }

  imgReuse = null;
  updateHeaderHeightVar();
  highlightActiveRow(false);
}

<script>

(function () {

const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } };
const lsDel = (k) => { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } };

const K = {
  speed: "xdash_listen_speed",       // 聴く速度(既定1.2)
  voice: "xdash_voice_quality",      // high | standard
  flowSec: "xdash_flow_sec",         // 流す: 1枚あたり秒
  introDay: "xdash_intro_day",       // 今日の要点→…を再生済みの日(JST02:00区切りのキー)
  session: "xdash_listen_session",   // 中断した聴くセッション
  tab: "xdash_tab",
  queue: "xdash_admin_queue",        // 端末キュー(管理操作)
  token: "xdash_admin_token",        // 管理トークン(第2段のログインが保存する)
  holdOff: "xdash_hold_open",
  cache: "xdash_listen_cache",       // ▶押下時に確保した、その日の聴くカード(通信できなくても続きから再生できる)

const LISTEN_THRESHOLD = 4;            // 「上限で流すに回った」とみなす点数
const EXTRA_SEC = 600;                 // 「+10分」
const UNDO_MS = 5000;                  // 「これは不要」の取り消し猶予

const JST_MS = 9 * 3600e3;

// ================================================================ 端末キュー(管理操作)
// tier_set / label_submit は操作ID付きで localStorage に積み、トークンがあれば即送信。
// 失敗・未ログインなら溜めて後で再送し、サーバーが受理(ok:true / duplicate:true)した後にだけ削除する。
// ログイン画面は出さない(設定タブと細い帯のみ)。第2段は AdminQueue.setToken / call / flush を使う。
const AdminQueue = (() => {
  const listeners = new Set();
  let flushing = null;
  let needLogin = false;
  let timer = null;
  const AUTH_ERR = /unauth|token|login|expired|forbidden/i;

  const load = () => { try { const a = JSON.parse(lsGet(K.queue, "[]")); return Array.isArray(a) ? a : []; } catch (e) { return []; } };
  const save = (q) => { lsSet(K.queue, JSON.stringify(q)); notify(); };
  const notify = () => { for (const f of listeners) { try { f(stats()); } catch (e) { /* ignore */ } } };

  function setToken(t) { if (t) lsSet(K.token, t); else lsDel(K.token); needLogin = false; notify(); if (t) flushSoon(); }
  function stats() {

  }
  function list() { return load(); }
  function onChange(f) { listeners.add(f); return () => listeners.delete(f); }

  function add(kind, payload, opId) {
    const q = load();

  async function call(action, body) {
    const token = getToken();
    const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-api`, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, ...(token ? { "x-admin-token": token } : {}) },
      body: JSON.stringify({ action, ...(body || {}) }),

  }

  async function doFlush() {
    let sent = 0;
    const skipped = new Set();
    if (!getToken()) { needLogin = load().length > 0; notify(); return { sent, remaining: load().length, reason: "no_token" }; }
    for (;;) {
      const q = load();
      const op = q.find((o) => !o.dead && !skipped.has(o.op_id));
      if (!op) break;
      let r;
      try {
        r = await call(op.kind, { ...op.payload, op_id: op.op_id });
      } catch (e) {

      }
      if (r.ok) { // 受理(重複受理 duplicate:true も成功扱い)
        save(load().filter((o) => o.op_id !== op.op_id));

        needLogin = false;
        continue;
      }
      const err = String((r.json && r.json.error) || "");
      if (r.status === 401 || r.status === 403 || AUTH_ERR.test(err)) { needLogin = true; notify(); return { sent, remaining: load().length, reason: "auth" }; }
      if (r.status === 429 || r.status >= 500 || r.status === 0) return { sent, remaining: load().length, reason: "retry_later" };

      if (cur) { cur.tries = (cur.tries || 0) + 1; cur.last_error = err || String(r.status); if (cur.tries >= 5) cur.dead = true; save(q2); }
      skipped.add(op.op_id);
    }
    return { sent, remaining: load().length };
  }
  function flush() {
    if (flushing) return flushing;
    flushing = doFlush().finally(() => { flushing = null; });
    return flushing;
  }
  function flushSoon() { clearTimeout(timer); timer = setTimeout(() => { flush().catch(() => {}); }, 30); }

  window.addEventListener("online", flushSoon);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") flushSoon(); });
  setInterval(() => { if (load().some((o) => !o.dead)) flushSoon(); }, 60000);

  return { add, flush, call, list, discard, clearDead, getToken, setToken, stats, onChange, newOpId };
})();
window.AdminQueue = AdminQueue;

// ================================================================ カードのデータ処理
const postTime = (p) => Date.parse(p.posted_at || p.fetched_at) || 0;
const tierTime = (p) => Date.parse(p.tier_assigned_at || p.fetched_at) || 0;
const scoreOrNeg = (p) => { const n = scoreNum(p); return n === null ? -1 : n; };

// 聴く順: 手動昇格 → 点数降順 → 新しい順
function rankCmp(a, b) {
  const pa = a.manual_action === "promote", pb = b.manual_action === "promote";
  if (pa !== pb) return pa ? -1 : 1;
  if (pa && pb) { const d = (Date.parse(b.manual_at) || 0) - (Date.parse(a.manual_at) || 0); if (d) return d; }
  const sd = scoreOrNeg(b) - scoreOrNeg(a);
  if (sd) return sd;
  return postTime(b) - postTime(a);
}

function titleOf(p) { return String(p.speech_title || p.gist || p.content || "").replace(/\s+/g, " ").trim().slice(0, 60); }
function bodyOf(p) { return String(p.speech_body || p.summary || "").trim(); }

function utterOf(p) {
  if (window.TTS && typeof TTS.utterances === "function") { try { return TTS.utterances(p) || []; } catch (e) { /* fallthrough */ } }
  const out = [];
  const t = titleOf(p), b = bodyOf(p);
  if (t) out.push({ kind: "title", text: t });
  if (b) out.push({ kind: "body", text: b });
  return out;
}
// 冒頭の重要度読み上げは5点と手動昇格のみ
function cardItems(p) {
  const items = [];
  const tag = [];
  if (scoreNum(p) === 5) tag.push("重要度5。");
  if (p.manual_action === "promote") tag.push("昇格した投稿です。");
  if (tag.length) items.push({ kind: "title", text: tag.join("") });
  for (const it of utterOf(p)) items.push(it);
  return items;
}
const itemsChars = (items) => items.reduce((n, it) => n + String(it.text || "").length, 0);
const cardSec = (p, speed) => itemsChars(cardItems(p)) / (CPS * speed);
const minutesLabel = (sec) => Math.max(1, Math.round(sec / 60));

// 今日の区分(降格・失効を反映した現在値)
//  聴く: listen区分の未読(昨日からの聴き残しを含む) / 流す: 今日(02:00 JST以降)区分された未読skim / 保留: 今日の保留
function computeToday(now) {
  now = now || Date.now();
  const ds = dayStartMs(now);
  const listen = [], skim = [], hold = [];
  let carry = 0;
  for (const p of allPosts) {
    const tier = p.listen_tier;
    if (!tier) continue;
    if (tier === "listen") {
      if (!p.is_read) { listen.push(p); if (tierTime(p) < ds) carry++; }
    } else if (tier === "skim") {
      if (!p.is_read && tierTime(p) >= ds) skim.push(p);
    } else if (tier === "hold") {
      if (Math.max(tierTime(p), Date.parse(p.manual_at) || 0) >= ds) hold.push(p);
    }
  }
  listen.sort(rankCmp);
  skim.sort(rankCmp);
  hold.sort(rankCmp);
  const speed = listenSpeed();
  const listenSecTotal = listen.reduce((n, p) => n + cardSec(p, speed), 0);
  const skimHigh = skim.filter((p) => scoreOrNeg(p) >= LISTEN_THRESHOLD);
  // 保留上位5件(見出し読み上げ用): 手動降格を除く・未読
  const holdTop = hold.filter((p) => p.manual_action !== "demote" && !p.is_read).slice(0, 5);
  return { dayStart: ds, dayKey: dayKey(now), listen, skim, hold, holdTop, skimHigh, carry, listenSec: listenSecTotal, listenMin: listen.length ? minutesLabel(listenSecTotal) : 0 };
}

// ---- 今日の要点(digest_daily)
const DG = { state: "none", row: null };
async function loadDigestDaily() {
  try {
    const rows = await sbFetch(`digest_daily?select=*&order=day.desc&limit=1`);
    const r = Array.isArray(rows) ? rows[0] : null;
    if (r && r.day) {
      if (typeof r.topics === "string") { try { r.topics = JSON.parse(r.topics); } catch (e) { r.topics = []; } }
      DG.state = "row"; DG.row = r;
    } else { DG.state = "none"; DG.row = null; }
  } catch (e) { DG.state = "error"; DG.row = null; } // テーブルが無い等でも画面を壊さない
  refreshToday();
}
function digestTopics(day) {
  const r = DG.row;
  if (DG.state !== "row" || !r || r.day !== day || !Array.isArray(r.topics)) return [];
  return r.topics.filter((t) => t && (t.headline || t.summary)).slice(0, 4);
}

// ================================================================ 今日タブの描画
let holdOpen = lsGet(K.holdOff, "0") === "1";

function loadSession() {
  try {
    const s = JSON.parse(lsGet(K.session, "null"));
    if (!s || typeof s !== "object") return null;
    if (s.day !== dayKey(Date.now())) { lsDel(K.session); return null; }
    return s;
  } catch (e) { return null; }
}
// 保存されたセッションのうち、まだ聴けるもの
function resumable(s) {
  if (!s) return { cards: [], hold: [], digest: false, n: 0 };
  const cards = (s.cardUrls || []).map(postByUrl).filter((p) => p && !p.is_read && p.listen_tier === "listen");
  const hold = (s.holdUrls || []).map(postByUrl).filter((p) => p && !p.is_read && p.listen_tier === "hold");
  const digest = !!s.withDigest && digestTopics(s.day).length > 0;
  return { cards, hold, digest, n: cards.length + hold.length + (digest ? 1 : 0) };
}

let todayCache = null;
function refreshToday() {
  const T = computeToday();
  todayCache = T;
  const now = Date.now();
  $("todayDate").textContent = new Date(now + JST_MS - 2 * 3600e3).toISOString().slice(5, 10).replace("-", "/");

  // 主ボタン / 案内
  const sess = loadSession();
  const rs = resumable(sess);
  $("resumeBox").hidden = rs.n === 0;
  if (rs.n > 0) $("resumeSub").textContent = rs.cards.length ? `残り${rs.cards.length}件` : "";
  const hasListen = T.listen.length > 0;
  $("btnListen").hidden = !hasListen;
  $("btnListen").textContent = `▶聴く(約${T.listenMin}分)`;
  $("listenGuide").hidden = hasListen;
  if (!hasListen) {
    $("listenGuide").textContent = T.skim.length || T.hold.length
      ? "今日の「聴く」カードはありません。「流す」または「一覧」で見られます。"
      : "今日の「聴く」カードはまだありません。新しい投稿が区分されるとここに出ます。";
  }
  const showExtra = !hasListen && T.skimHigh.length > 0;
  $("btnExtraToday").hidden = !showExtra;
  if (showExtra) $("btnExtraToday").textContent = `上限で流すに回った${LISTEN_THRESHOLD}点以上が${T.skimHigh.length}件 ・ +10分聴く`;

  // 内訳
  $("breakdown").innerHTML = `聴く<b>${T.listen.length}</b>件・約<b>${T.listenMin}</b>分 / 流す<b>${T.skim.length}</b>件 / 保留<b>${T.hold.length}</b>件`;
  $("btnFlow").textContent = `🌊 流す(${T.skim.length})`;
  $("btnFlow").disabled = T.skim.length === 0;

  renderDigestCard(T);
  renderHold(T);
  updateBands(T, sess, rs);
}

function renderDigestCard(T) {
  const el = $("digestCard");
  if (DG.state === "error") { el.hidden = true; return; }
  el.hidden = false;
  const r = DG.row;
  const isToday = DG.state === "row" && r && r.day === T.dayKey;
  let html = `<h2>📌 今日の要点</h2>`;
  if (!isToday) {
    html += `<div class="muted" style="font-size:14px">今日の要点はまだありません。</div>`;
  } else {
    const topics = digestTopics(T.dayKey);
    if (r.status === "paused") html += `<div style="font-size:14px;color:#ffb3c0;margin-bottom:6px">⏸ 費用上限のため、要点の生成を停止中です。</div>`;
    if (topics.length) {
      html += topics.map((t) => `<div class="topic"><b>${esc(t.headline)}</b>${t.is_followup ? ` <span class="chip-prov">続報</span>` : ""}<p>${esc(t.summary)}</p></div>`).join("");
    } else if (r.status === "failed") html += `<div class="muted" style="font-size:14px">今日の要点を生成できませんでした。</div>`;
    else if (r.status !== "paused") html += `<div class="muted" style="font-size:14px">要点にできる新着がまだありません。</div>`;
    if (r.generated_at) {
      const d = new Date(r.generated_at);
      html += `<div class="sub" style="margin-top:8px;text-align:right">生成 ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}</div>`;
    }
  }
  el.innerHTML = html;
}

function holdItemHtml(p) {
  const demoted = p.manual_action === "demote";
  return `<div class="holditem" data-url="${esc(p.post_url)}">
    <div class="hi-body"><div class="hi-title">${scoreBadgeHtml(p)}${esc(titleOf(p))}${demoted ? ` <span class="chip-prov">手動降格</span>` : ""}</div>${kindLineHtml(p)}</div>
    <button type="button" class="btn small" data-act="promote">聴くへ戻す</button>

}
function renderHold(T) {

$("holdList").addEventListener("click", (e) => {
